<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>loft — Windows client</title>
  <script>if (/[?&]capture=/.test(location.search)) document.documentElement.classList.add("capture");</script>
  <style>
    :root {
      --ink: #1A1714;
      --ink-2: #241f1b;
      --slate: #3A332E;
      --stone: #B7A99A;
      --copper: #C67B3A;
      --lamp: #E8B84A;
      --lamp-hi: #F3D27A;
      --snow: #F3EDE4;
      --paper: #E8DFD2;
      --mute: #8A7E72;
      --line: rgba(243,237,228,.12);
      --ok: #7dba6a;
      --err: #E24B4B;
      --ui: "Avenir Next", Avenir, "Helvetica Neue", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      --mono: Consolas, "SF Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--ui);
      background: #0e0c0b;
      color: var(--snow);
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100%;
    }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; }
    html.capture, html.capture body {
      display: block; overflow: hidden; background: #1A1714; height: auto;
    }
    html.capture nav, html.capture .taskbar, html.capture .titlebar { display: none !important; }
    html.capture .stage-wrap { padding: 0; display: block; }
    html.capture .desktop {
      width: auto; aspect-ratio: auto; max-height: none;
      border-radius: 0; box-shadow: none; background: #1A1714; overflow: hidden;
    }
    html.capture .desktop-body { position: static; }
    html.capture .win {
      position: relative; left: auto; top: auto; transform: none;
      border: 0; border-radius: 0; box-shadow: none; background: #1A1714;
    }
    html.capture .win.main { height: 476px; }
    html.capture .win.conns { height: 496px; }
    html.capture .win.main .body { padding-top: 16px; }
    html.capture .win.conns .body { padding-top: 16px; }
    html.capture .popover, html.capture .tray-menu { display: none; }

    /* ── board chrome ── */
    nav {
      border-right: 1px solid #2a2420;
      padding: 16px 12px;
      background: #14110f;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { width: 0; height: 0; }
    nav .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 8px 18px;
      font-weight: 600; letter-spacing: -0.04em; font-size: 1.15rem;
    }
    nav .brand svg { width: 28px; height: 28px; }
    nav p { margin: 0 8px 16px; color: var(--mute); font-size: 0.75rem; line-height: 1.4; }
    nav button {
      display: block; width: 100%;
      text-align: left; background: none; border: 0; color: var(--stone);
      font: 500 13px var(--ui); padding: 5px 10px; border-radius: 8px; cursor: pointer;
    }
    nav button:hover { background: #1e1a17; color: var(--snow); }
    nav button.on { background: #2a2420; color: var(--snow); }
    nav h4 {
      margin: 14px 8px 4px; font-size: 0.65rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--mute); font-weight: 600;
    }
    .lang {
      display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 8px 10px;
    }
    .lang button {
      flex: 1 1 28%; min-width: 36px; text-align: center; padding: 6px 0; font-weight: 600;
      letter-spacing: 0.04em; font-size: 11px;
    }
    .lang button.on { background: var(--lamp); color: var(--ink); }

    .stage-wrap {
      padding: 28px; display: flex; align-items: center; justify-content: center;
      min-height: 0; overflow: hidden;
    }
    .desktop {
      width: min(1080px, 100%);
      aspect-ratio: 16 / 10;
      max-height: calc(100vh - 56px);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(1200px 500px at 70% -10%, #3a2a1c 0%, transparent 55%),
        radial-gradient(800px 600px at 10% 120%, #1c1814 0%, transparent 50%),
        linear-gradient(180deg, #2a221c 0%, #12100e 70%);
      box-shadow: 0 40px 80px rgba(0,0,0,.45);
    }
    /* Taskbar of the host OS: only a backdrop for the tray icon. Neutral on purpose. */
    .taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
      display: flex; align-items: center; gap: 4px; padding: 0 6px;
      background: rgba(14,12,11,.92);
      border-top: 1px solid rgba(255,255,255,.06);
      color: #f4efe8; font-size: 12px; user-select: none; z-index: 30;
    }
    .taskbar .tb-start, .taskbar .tb-app {
      width: 40px; height: 32px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .taskbar .tb-start i { width: 16px; height: 16px; border-radius: 3px; background: #5a514a; display: block; }
    .taskbar .tb-app i { width: 18px; height: 18px; border-radius: 4px; background: #3a332e; display: block; }
    .taskbar .tb-app.loft { position: relative; background: rgba(255,255,255,.08); cursor: pointer; }
    .taskbar .tb-app.loft::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px;
      height: 2px; border-radius: 1px; background: var(--lamp);
    }
    .taskbar .tb-app.loft svg { width: 20px; height: 20px; }
    .taskbar .tray { margin-left: auto; display: flex; align-items: center; gap: 2px; height: 100%; }
    .taskbar .tray > span {
      height: 32px; min-width: 28px; padding: 0 6px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    .taskbar .tray .tray-loft { cursor: pointer; }
    .taskbar .tray > span:hover, .taskbar .tray .tray-loft.open { background: rgba(255,255,255,.1); }
    .taskbar .tray svg { display: block; }
    .taskbar .tray .clock { flex-direction: column; line-height: 1.25; font-size: 11.5px; text-align: center; padding: 0 8px; }
    .taskbar .tray .kb { font-size: 11px; letter-spacing: .04em; }
    .tray-mark .tb { fill: var(--copper); }
    .tray-mark .tl { fill: var(--copper); }
    .tray-mark.on .tl { fill: var(--lamp); }
    .tray-mark.err .tl { fill: var(--err); }

    /* tray context menu (right click) */
    .tray-menu {
      position: absolute; right: 96px; bottom: 8px; min-width: 232px;
      background: #2a2420; border: 1px solid #3a332e; border-radius: 8px;
      padding: 6px 0; z-index: 40; box-shadow: 0 12px 32px rgba(0,0,0,.4);
      color: #f4efe8;
    }
    .tray-menu button {
      display: flex; justify-content: space-between; align-items: center; gap: 24px;
      width: 100%; text-align: left; background: none; border: 0;
      color: #f4efe8; font: 500 13px var(--ui); padding: 6px 16px; cursor: pointer;
    }
    .tray-menu button:hover, .tray-menu .tm-sub.open > button { background: var(--lamp); color: var(--ink); }
    .tray-menu button.tm-head { font-weight: 600; }
    .tray-menu hr { border: 0; border-top: 1px solid #3a332e; margin: 4px 0; }
    .tray-menu .mi-row { display: inline-flex; align-items: center; gap: 8px; }
    .tray-menu .mi { width: 14px; height: 14px; flex: none; opacity: .9; }
    .tray-menu .chk {
      width: 14px; height: 14px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; line-height: 1;
    }
    .tray-menu .tm-sub { position: relative; }
    .tray-menu .sub-arr { opacity: .45; font-size: 12px; }
    .tray-menu .tm-sub > .tray-menu {
      display: none; right: calc(100% + 2px); left: auto; bottom: auto; top: -6px; min-width: 200px;
    }
    .tray-menu .tm-sub:hover > .tray-menu, .tray-menu .tm-sub.open > .tray-menu { display: block; }
    .tray-menu .st { color: var(--mute); font-size: 12px; }
    .tray-menu button:hover .st { color: var(--ink); }

    .desktop-body { position: absolute; inset: 0 0 40px 0; }

    /* ── windows ── */
    .win, .popover {
      scrollbar-width: none;
    }
    .win::-webkit-scrollbar, .popover::-webkit-scrollbar { width: 0; height: 0; }
    .win {
      position: absolute;
      background: var(--ink);
      border: 1px solid #2e2824;
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04) inset;
      overflow: hidden;
      color: var(--snow);
    }
    .win.light {
      background: #f6f1ea;
      color: var(--ink);
      border-color: #e2d8cc;
    }
    /* Own title bar: drawn by the app, so Windows 7, 10 and 11 look the same. */
    .titlebar {
      display: flex; align-items: center; height: 32px; padding-left: 12px;
      user-select: none;
    }
    .titlebar .tmark { width: 16px; height: 16px; flex: none; }
    .titlebar .ttl { margin-left: 8px; font-size: 12px; font-weight: 500; color: var(--stone); letter-spacing: -0.01em; }
    .titlebar .caps { margin-left: auto; display: flex; align-self: stretch; }
    .titlebar .caps button {
      width: 46px; border: 0; background: none; color: var(--stone);
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    }
    .titlebar .caps button:hover { background: rgba(255,255,255,.08); color: var(--snow); }
    .titlebar .caps button.x:hover { background: #C42B1C; color: #fff; }
    .titlebar .caps svg { width: 10px; height: 10px; }
    /* Header buttons (Reset routes, QR) hug their label; the macOS mock stretches them. */
    .head-row > .btn { width: auto; }
    .win h1 {
      margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.04em;
    }
    .muted { color: var(--mute); }
    .win.light .muted { color: #8a7e72; }

    /* popover */
    .popover {
      position: absolute;
      bottom: 8px; right: 12px;
      width: 300px;
      z-index: 6;
      background: #201c19;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      color: var(--snow);
      padding: 14px 14px 10px;
    }
    .popover.light {
      background: rgba(246,241,234,.94);
      color: var(--ink);
      border-color: rgba(0,0,0,.06);
    }
    .pop-head { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .pop-head .mark { width: 36px; height: 36px; flex: none; }
    .pop-head .who { min-width: 0; flex: 1; }
    .pop-head .t { font-weight: 600; letter-spacing: -0.03em; font-size: 13px; }
    .pop-head .s { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .pop-head .s span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pop-rate { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--mute); line-height: 1.35; flex: none; }
    .lamp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); flex: none; }
    .lamp-dot.on { background: var(--lamp); }
    .lamp-dot.err { background: var(--err); }
    .btn {
      width: 100%; border: 0; border-radius: 10px;
      padding: 11px 14px; font: 600 14px var(--ui);
      letter-spacing: -0.02em; cursor: pointer;
      transition: filter 0.08s ease, transform 0.08s ease;
    }
    .btn:active {
      filter: brightness(0.78);
      transform: scale(0.96);
    }
    .btn.connect { background: var(--slate); color: var(--snow); }
    .btn.connect.on { background: var(--lamp); color: var(--ink); }
    .btn.ghost { background: transparent; color: var(--mute); font-weight: 500; font-size: 12.5px; }
    .rows { margin: 12px 0 4px; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12.5px; padding: 6px 2px;
    }
    .row .k { color: var(--mute); }
    .row .v { font-family: var(--mono); font-size: 11.5px; }
    .spark { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mute); padding: 8px 2px 4px; }
    .spark .err { color: var(--err); }
    .pop-foot {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px;
    }
    .pop-foot a, .pop-foot button {
      color: var(--stone); text-decoration: none; font: 500 12.5px var(--ui);
      background: none; border: 0; padding: 4px 0; cursor: pointer;
    }
    .pop-foot .left { justify-self: start; }
    .pop-foot .mid { justify-self: center; }
    .pop-foot .right { justify-self: end; }
    .row .k { display: inline-flex; align-items: center; gap: 6px; }
    .conn-menu {
      position: absolute;
      right: 324px;
      bottom: 8px;
      min-width: 220px;
      background: #2a2420;
      border: 1px solid #3a332e;
      border-radius: 8px;
      padding: 6px 0;
      z-index: 8;
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
    }
    .conn-menu button {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      width: 100%; text-align: left; background: none; border: 0;
      color: var(--snow); font: 500 13px var(--ui); padding: 6px 16px; cursor: pointer;
    }
    .conn-menu button:hover { background: var(--lamp); color: var(--ink); }
    .win.journal {
      width: 520px; height: 480px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
    }
    .win.journal .body { padding: 8px 20px 0; display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .win.journal h1 { text-align: center; margin: 0 0 4px; font-size: 1.25rem; }
    .win.journal .sub { text-align: center; color: var(--mute); font-size: 12px; margin: 0 0 10px; line-height: 1.35; }
    .win.journal .log {
      flex: 1; min-height: 0; overflow: auto;
      background: #211c19; border-radius: 12px;
      padding: 10px 12px; font: 11px var(--mono); color: var(--snow);
      white-space: pre-wrap; line-height: 1.45;
    }
    .win.journal .log.empty { color: var(--mute); }
    .win.journal .jfoot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0 18px;
    }
    .win.journal .jfoot button {
      background: none; border: 0; color: var(--mute);
      font: 500 12.5px var(--ui); cursor: pointer; padding: 4px 8px;
    }
    .port-field {
      width: 80px; text-align: center; margin: 0; padding: 7px 8px;
    }
    .url-field { width: 100%; margin: 8px 0 0; padding: 8px 12px; }
    .head-plus {
      width: 22px; height: 22px; border: 0; border-radius: 7px;
      background: var(--lamp); color: var(--ink);
      font: 700 16px var(--ui); line-height: 1; cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      flex: none;
    }
    .head-title { display: flex; align-items: center; gap: 8px; min-width: 0; }

    /* main window */
    .main {
      width: 400px; height: 500px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .main.aside {
      left: 38%;
    }
    .win.main.simple, .win.conns.simple {
      height: auto;
      max-height: calc(100% - 24px);
    }
    .win.main.simple .body { padding-bottom: 22px; }
    .foot {
      margin-top: 18px; font-size: 11.5px; color: var(--mute); text-align: center;
    }
    .win.main { display: flex; flex-direction: column; }
    .win.main .body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 8px 22px 0;
    }
    .win.main .actions {
      margin: auto -22px 0;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      gap: 6px;
    }
    .win.main .actions .btn { flex: 1; padding: 8px 6px; font-size: 11.5px; }
    .hero {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 12px 0 18px;
    }
    .hero .mark { width: 72px; height: 72px; margin-bottom: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: var(--mute);
      background: #211c19; border-radius: 99px; padding: 4px 10px; margin-top: 8px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
    .dot.on { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
    .dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin: 16px 0;
    }
    .stat {
      background: #211c19; border-radius: 10px; padding: 10px 10px 8px;
    }
    .stat .k { font-size: 10.5px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
    .stat .v { font-family: var(--mono); font-size: 12px; margin-top: 4px; }
    .list { margin-top: 6px; }
    .item {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
      padding: 10px 10px; border-radius: 10px; cursor: pointer;
    }
    .item:hover { background: #211c19; }
    .item .n { font-size: 13.5px; font-weight: 600; letter-spacing: -0.02em; }
    .item .u { font-size: 11.5px; color: var(--mute); font-family: var(--mono); }
    .item .tag { font-size: 10.5px; color: var(--stone); align-self: center; }
    .item.live { background: #211c19; }
    .item.live .tag { color: var(--lamp); }
    .item.err .tag, .item .u.err { color: var(--err); }

    /* onboarding */
    .onb {
      width: 440px; height: 520px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .onb.tall { height: 580px; }
    .onb .body { padding: 8px 36px 28px; text-align: center; }
    .onb .mark { display: block; width: 64px; height: 64px; margin: 8px auto 12px; }
    .onb p { color: var(--mute); font-size: 13.5px; line-height: 1.5; }
    .field {
      width: 100%; margin: 18px 0 8px;
      background: #211c19; border: 1px solid #3a332e; border-radius: 10px;
      padding: 12px 14px; color: var(--snow); font: 500 14px var(--mono);
      outline: none;
    }
    .field:focus { border-color: var(--lamp); }
    .hint { font-size: 12px; color: var(--mute); text-align: left; }
    .steps { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
    .label { font-size: 11.5px; color: var(--mute); text-align: left; margin: 14px 0 6px; }
    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1; border: 1px solid #3a332e; background: #211c19; color: var(--stone);
      border-radius: 9px; padding: 9px 8px; font: 600 12.5px var(--ui); cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .seg button.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
    .rate-bits { display: flex; flex-direction: column; gap: 4px; }
    .rate-bits button {
      min-width: 72px; padding: 3px 8px; font: 600 11px var(--ui);
      border-radius: 7px; border: 1px solid #3a332e; background: #211c19;
      color: var(--stone); cursor: pointer;
    }
    .rate-bits button.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
    .loft-select {
      appearance: none; -webkit-appearance: none;
      min-width: 168px; max-width: 200px;
      background: #211c19 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='%238A7E72' d='M0 0l5 6 5-6z'/></svg>") no-repeat right 10px center;
      color: var(--snow); border: 1px solid #3a332e; border-radius: 10px;
      padding: 7px 28px 7px 12px; font: 600 12.5px var(--ui); cursor: pointer;
    }
    .loft-select.wide {
      display: block; width: 100%; min-width: 0; max-width: none;
      padding: 9px 28px 9px 12px; margin: 0;
    }
    .split-zone { margin: 0 0 8px; }
    .split-zone .label { margin: 4px 0 6px; }
    .split-zone-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .split-zone-head .label { margin: 4px 0 6px; }
    .split-zone-head .ghost-sm { margin: 0; padding: 0; color: var(--lamp); font-weight: 600; }
    .field.sm:disabled { opacity: .55; cursor: default; }
    .field.sm { margin: 0; padding: 10px 12px; font-size: 13px; }
    .repo-row { display: flex; gap: 8px; align-items: stretch; }
    .repo-row .field { flex: 1; min-width: 0; width: auto; }
    .repo-row .pick {
      flex: 0 0 auto; margin: 0; padding: 0 14px;
      border: 1px solid #3a332e; background: #211c19; color: var(--snow);
      border-radius: 10px; font: 600 12.5px var(--ui); cursor: pointer;
    }
    .repo-row .pick:hover { border-color: var(--lamp); color: var(--lamp); }
    .btn.back { background: transparent; color: var(--mute); font-weight: 500; margin-top: 8px; }

    /* settings */
    .sheet {
      width: 440px; height: auto; max-height: calc(100% - 24px);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .sheet .body { padding: 0 22px 12px; }
    .sheet h1 { margin: 14px 0 8px; font-size: 1.2rem; }
    .sheet .head-row { margin: 14px 0 8px; align-items: center; }
    .sheet .head-row h1 { margin: 0; line-height: 28px; }
    .sheet .head-row .btn { height: 28px; box-sizing: border-box; display: inline-flex; align-items: center; }

    let sharedSocks = params.get("socks") !== "0";
    let simpleOn = params.get("simple") === "1";

    let setTab = ["gen", "route", "client"].includes(params.get("settab")) ? params.get("settab") : "gen";
    let socksPort = Number(params.get("sport")) > 0 && Number(params.get("sport")) < 65536 ? Number(params.get("sport")) : 1080;
    const dedicatedPort = (p) => {
      const d = String(p.socks || "");

    };
    const gwOf = (p) => {
      if (p.gw) return p.gw;
      const a = String(p.ip || "").split(".");
      if (a.length === 4 && a[3] !== "1") return a[0] + "." + a[1] + "." + a[2] + ".1";

    };
    const routeOf = (p, on, fail, locked) => {
      if (locked) return t("route.held");
      if (on && !fail && p.tun) return gwOf(p);
      if (p.tun) return defaultRouteOn ? t("edit.tun") : t("pop.tun");
      return "SOCKS5";
    };
    const socksOf = (p) => {
      const d = dedicatedPort(p);
      if (d) return d;
      if (sharedSocks) return String(socksPort);
      let n = socksPort;
      for (const x of PROFILES) {
        if (x.id === p.id) return String(n);
        if (!dedicatedPort(x)) n += 1;
      }
      return String(socksPort);
    };
    const ROUTES = [
      { id: "yt", ru: "YouTube", en: "YouTube", region: "global", cidrs: ["142.250.0.0/16", "172.217.0.0/16", "74.125.0.0/16", "142.251.0.0/16", "173.194.0.0/16", "216.58.0.0/16"], src: "repo" },
      { id: "cf", ru: "Cloudflare", en: "Cloudflare", de: "Cloudflare", fr: "Cloudflare", pt: "Cloudflare", zh: "Cloudflare", it: "Cloudflare", ja: "Cloudflare", ko: "Cloudflare", region: "global", cidrs: ["1.1.1.0/24", "104.16.0.0/13"], src: "repo" },
      { id: "gpt", ru: "ChatGPT", en: "ChatGPT", de: "ChatGPT", fr: "ChatGPT", pt: "ChatGPT", zh: "ChatGPT", it: "ChatGPT", ja: "ChatGPT", ko: "ChatGPT", region: "global", cidrs: ["104.18.32.0/24"], src: "me" },
      { id: "nf", ru: "Netflix", en: "Netflix", region: "global", cidrs: ["45.57.0.0/16", "108.175.32.0/20"], src: "repo" },
      { id: "yandex", ru: "Яндекс", en: "Yandex", de: "Yandex", fr: "Yandex", pt: "Yandex", zh: "Yandex", it: "Yandex", ja: "Yandex", ko: "Yandex", region: "local", cidrs: ["5.255.255.0/24", "77.88.8.0/24"], src: "me" },
      { id: "lan", ru: "Локальная сеть", en: "LAN", de: "LAN", fr: "LAN", pt: "LAN", zh: "局域网", it: "LAN", ja: "LAN", ko: "로컬 네트워크", region: "local", cidrs: ["10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"], src: "me" },
      { id: "ign", ru: "Игнор", en: "Ignore", de: "Ignorieren", fr: "Ignorer", pt: "Ignorar", zh: "忽略", it: "Ignora", ja: "無視", ko: "무시", vi: "Bỏ qua", region: "local", cidrs: ["104.16.0.0/12"], src: "ignore" },
    ];
    const locName = (o) => o[lang] || o.en || o.ru || "";
    const rname = (r) => locName(r);
    // Russian has a few-form: 1 сеть, 2–4 сети, 5+ сетей.
    const netWord = (n) => {
      if (lang === "ru") { const d = n % 10, h = n % 100; if (d === 1 && h !== 11) return t("split.net"); if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return t("split.nets.few"); return t("split.nets"); }
      return n === 1 ? t("split.net") : t("split.nets");
    };
    // A Keenetic export is named after the zone's first service.
    const keenName = () => { const r = routesIn(regionTab)[0]; return r ? rname(r) : "routes"; };
    const zoneLabel = (id) => {
      const z = zoneById(id);
      const named = z ? locName(z) : "";
      if (named) return named;
      const k = "split.zone." + id;
      const s = t(k);
      return s === k ? String(id).toUpperCase() : s;
    };
    const zoneIds = () => {
      const ids = [];
      const add = (id) => { if (id && !ids.includes(id)) ids.push(id); };
      ZONE_PRESETS.forEach(add);
      ZONES.forEach((z) => add(z.id));
      ROUTES.forEach((r) => add(r.region));
      return ids;
    };
    const zoneDef = (id) => {
      const z = zoneById(id);
      if (z) return !!z.def;
      return id !== "local";
    };
    const zoneSlug = (name) => {
      const ascii = String(name || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "").slice(0, 16);
      const taken = (id) => ZONES.some((z) => z.id === id);
      if (ascii) {
        let id = ascii, n = 2;
        while (taken(id)) { id = ascii + n; n += 1; }
        return id;
      }
      let n = 1, id = "z1";
      while (taken(id)) { n += 1; id = "z" + n; }
      return id;
    };
    const zoneSelect = (withCount) => {
      const ids = zoneIds();
      if (regionTab && !ids.includes(regionTab)) ids.push(regionTab);
      const opts = ids.map((id) => {
        const n = routesIn(id).length;
        const label = withCount ? zoneLabel(id) + " · " + n : zoneLabel(id);
        return `<option value="${id}" ${regionTab === id ? "selected" : ""}>${label}</option>`;
      }).join("");
      return `<select class="loft-select wide" data-region>${opts}</select>`;
    };
    const zoneTabs = () => {

      }).join("");

    };
    const escAttr = (s) => String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

    const TRAY_PATHS = `<path class="tb" d="M6.2100 0.6270 A0.1680 0.1680 0 0 1 6.4249 0.6312 L9.6800 4.7000 L9.6800 10.8300 A0.7700 0.7700 0 0 0 10.4500 11.6000 L14.4400 11.6000 A0.5600 0.5600 0 0 1 15.0000 12.1600 L15.0000 14.8280 A0.6720 0.6720 0 0 1 14.3280 15.5000 L3.3520 15.5000 A0.6720 0.6720 0 0 1 2.6800 14.8280 L2.6800 4.7000 Z"/><path class="tl" d="M5.0880 5.9000 H7.2720 A0.4480 0.4480 0 0 1 7.7200 6.3480 V9.3520 A0.4480 0.4480 0 0 1 7.2720 9.8000 H5.0880 A0.4480 0.4480 0 0 1 4.6400 9.3520 V6.3480 A0.4480 0.4480 0 0 1 5.0880 5.9000 Z"/>`;

    const sceneEl = document.getElementById("scene");
    const mb = document.getElementById("mb-loft");

    function paintBoard() {
      document.documentElement.lang = lang;
      document.getElementById("board-sub").textContent = t("board.sub");
      document.getElementById("board-lang").textContent = t("board.lang");
      document.getElementById("board-scenes").textContent = t("board.scenes");
      document.querySelectorAll("nav button[data-i18n]").forEach((b) => {
        b.textContent = t(b.dataset.i18n);
      });
      document.querySelectorAll(".lang button").forEach((b) => {
        b.classList.toggle("on", b.dataset.lang === lang);
      });
    }

    function loftWindowKey(name) {
      return !["on", "off", "err", "hold", "switch", "traymenu"].includes(name);
    }

    // Taskbar button follows the "Taskbar button" setting (macOS: Dock icon).
    function paintTaskbar(name) {
      const btn = document.getElementById("tb-loft");
      const show = dockMode === "always" || (dockMode === "window" && loftWindowKey(name));
      btn.classList.toggle("hide", !show);
      btn.innerHTML = MARK.replace("MARKCLASS", anyUp() && !heldNow ? "on" : "");
      btn.onclick = () => show && window.__show && window.__show("main");
      document.getElementById("tb-kb").textContent = lang === "ru" ? "РУС" : lang === "zh" ? "中" : "ENG";
    }

    function paintMenuLamp(name) {
      const svg = document.getElementById("mb-svg");
      svg.classList.remove("on", "err");
      const hide = ["onboard", "url", "about", "import", "export"].includes(name);
      // Off: the window is copper like the body (docs/brand loft-tray-off).
      let st = "off";
      if (hide) st = "off";
      else if (heldNow || name === "hold" || name === "err" || (multi && name !== "off" && anyErr())) st = "err";
      else if (multi) st = name !== "off" && anyUp() ? "on" : "off";
      else if (["on", "hero", "main", "out", "switch", "traymenu", "list", "edit", "editvless", "journal", "set"].includes(name)) st = "on";
      if (st !== "off") svg.classList.add(st);
      svg.style.opacity = "1";
    }

    function show(name, keep) {
      current = name;
      if (!keep) {
        PROFILES.forEach((p) => {
          p.err = false;
          if (name === "off" || name === "hold") p.up = false;
          else if (name === "traymenu" && !multi) p.up = p.id === activeId;
          else if (multi) p.up = p.id === "office" || p.id === "lab";
          else p.up = p.id === activeId;
        });
      }
      if (name === "err") {
        const lab = PROFILES.find((p) => p.id === "lab");
        lab.err = true;
        lab.up = false;
      }
      if (name === "hold") {
        PROFILES.forEach((p) => { p.up = false; p.err = false; });
        heldNow = true;
      } else if (!keep) {
        heldNow = name === "off" && holdOn;
      }
      if (name === "about" && !keep) aboutChecked = false;
      sceneEl.innerHTML = scenes[name]();
      document.querySelectorAll("nav button[data-scene]").forEach((b) => b.classList.toggle("on", b.dataset.scene === name));
      mb.classList.toggle("open", ["on", "off", "hero", "switch", "err", "hold", "traymenu"].includes(name));
      paintMenuLamp(name);
      paintTaskbar(name);
      sceneEl.querySelectorAll("[data-go]").forEach((b) => {
        b.onclick = () => {
          applySceneZoneFields();
          show(b.dataset.go);
        };
      });
      sceneEl.querySelectorAll("[data-quiet]").forEach((row) => {
        row.onclick = () => {
          const box = row.querySelector("[data-check]");
          if (box) box.classList.toggle("on");
        };
      });
      sceneEl.querySelectorAll("[data-updcheck]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          if (aboutChecked) return;
          aboutChecked = true;
          show("about", true);
        };
      });
      sceneEl.querySelectorAll(".seg").forEach((seg) => {
        seg.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            seg.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
            b.classList.add("on");
          };
        });
      });
      sceneEl.querySelectorAll("[data-vless-mode]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          vlessMode = el.dataset.vlessMode === "manual" ? "manual" : "link";
          show("editvless", true);
        };
      });
      sceneEl.querySelectorAll("[data-loft-mode]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          loftMode = el.dataset.loftMode === "manual" ? "manual" : "link";
          show("edit", true);
        };
      });
      sceneEl.querySelectorAll("[data-edittab]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          editTab = el.dataset.edittab === "adv" ? "adv" : "main";
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-extip]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          extIPOn = !extIPOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-sport]").forEach((el) => {
        el.onchange = () => {
          const n = Number(el.value);
          if (n > 0 && n < 65536) socksPort = Math.floor(n);
        };
      });
      sceneEl.querySelectorAll("[data-region]").forEach((el) => {
        const apply = (ev) => {
          ev.stopPropagation();
          const next = el.tagName === "SELECT" ? el.value : el.dataset.region;
          if (!next) return;
          regionTab = next;
          show(current, true);
        };
        el[el.tagName === "SELECT" ? "onchange" : "onclick"] = apply;
      });
      sceneEl.querySelectorAll("[data-zid]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          editingZoneId = el.dataset.zid;
          show("zoneedit", true);
        };
      });
      sceneEl.querySelectorAll("[data-zdef]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          applySceneZoneFields();
          const z = zoneById(editingZoneId);
          if (z) z.def = el.dataset.zdef === "via";
          show("zoneedit", true);
        };
      });
      sceneEl.querySelectorAll("[data-zadddef]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          applySceneZoneFields();
          addZoneVia = el.dataset.zadddef === "via";
          show("zoneadd", true);
        };
      });
      sceneEl.querySelectorAll("[data-zsave]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          applySceneZoneFields();
          show("zones", true);
        };
      });
      sceneEl.querySelectorAll("[data-listopen]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          applySceneZoneFields();
          listPickBack = current;
          show("splitlists", true);
        };
      });
      sceneEl.querySelectorAll("[data-listpick]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const e = LIST_CATALOG.find((x) => x.id === el.dataset.listpick);
          if (!e) return;
          const url = listURL(e);
          if (listPickBack === "zoneadd") addZoneRepo = url;
          else {
            const z = listPickBack === "zoneedit" ? zoneById(editingZoneId) : zoneById(regionTab);
            if (z) z.repo = url;
          }
          show(listPickBack, true);
        };
      });
      sceneEl.querySelectorAll("[data-zrepopull]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const z = applySceneZoneFields() || zoneById(regionTab);
          if (z) z.pulled = true;
          show("split", true);
        };
      });
      sceneEl.querySelectorAll("[data-zdel]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const z = zoneById(editingZoneId);
          if (!z || z.builtin) return;
          ROUTES.forEach((r) => { if (r.region === z.id) r.region = "global"; });
          const i = ZONES.findIndex((x) => x.id === z.id);
          if (i >= 0) ZONES.splice(i, 1);
          if (regionTab === z.id) regionTab = "global";
          editingZoneId = "local";
          show("zones", true);
        };

      sceneEl.querySelectorAll("[data-zadd]").forEach((el) => {

          ev.stopPropagation();
          applySceneZoneFields();

            const n = document.querySelector("[data-sq]");
            if (n) {
              n.focus();
              try { n.setSelectionRange(pos, pos); } catch (_) {}
            }
          });

        el.onclick = (ev) => {
          ev.stopPropagation();
          splitFmt = el.dataset.sfmt;
          show("splitout", true);
        };
      });
      sceneEl.querySelectorAll("[data-kind]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          addKind = el.dataset.kind === "ignore" ? "ignore" : "route";
          show("splitadd", true);
        };
      });
      sceneEl.querySelectorAll("[data-sauto]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          applySceneZoneFields();
          if (current === "zoneadd") addZoneAuto = !addZoneAuto;
          else {
            const z = current === "zoneedit" ? zoneById(editingZoneId) : zoneById(regionTab);
            if (z) z.auto = z.auto === false;
          }
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-split]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          splitOn = !splitOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-socks]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          sharedSocks = !sharedSocks;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-simple]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          simpleOn = !simpleOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-dock]").forEach((el) => {
        el.onchange = (ev) => {
          ev.stopPropagation();
          dockMode = el.value || "window";
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-setlang]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          setLang(el.dataset.setlang);
        };
      });
      sceneEl.querySelectorAll(".tm-sub > button").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          el.parentElement.classList.toggle("open");
        };
      });
      sceneEl.querySelectorAll("[data-uilang]").forEach((el) => {
        el.onchange = (ev) => {
          ev.stopPropagation();
          if (LANGS.includes(el.value)) setLang(el.value);
        };
      });
      sceneEl.querySelectorAll("[data-profile]").forEach((el) => {
        el.onclick = (ev) => {
          if (ev.target.closest("[data-toggle],[data-edit],[data-retry]")) return;
          if (multi) {
            editingId = el.dataset.profile;
            if (current === "list" || current === "main") show("edit");
            return;
          }
          activeId = el.dataset.profile;
          show(current === "switch" ? "on" : current, current === "traymenu");
        };
      });
      sceneEl.querySelectorAll("[data-prefer]").forEach((el) => {
        el.onclick = (ev) => {
          if (ev.target.closest("[data-toggle]")) return;
          activeId = el.dataset.prefer;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-toggle]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          const p = PROFILES.find((x) => x.id === b.dataset.toggle);
          if (p) {
            p.up = !p.up;
            p.err = false;
          }
          if (holdOn && liveTuns().length === 0) heldNow = true;
          if (liveTuns().length > 0) heldNow = false;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-retry]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          const p = PROFILES.find((x) => x.id === b.dataset.retry);
          if (p) {
            p.err = false;
            p.up = true;
          }
          show("on");
        };
      });
      sceneEl.querySelectorAll("[data-edit]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          editingId = b.dataset.edit;
          show("edit");
        };
      });
      sceneEl.querySelectorAll("[data-multi]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          multi = !multi;
          if (!multi) {
            const firstUp = PROFILES.find((x) => x.up);
            if (firstUp) activeId = firstUp.id;
          }
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-reconnect]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          reconnectOn = !reconnectOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-tun]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const p = PROFILES.find((x) => x.id === el.dataset.tun);
          if (p) p.tun = !p.tun;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-defroute]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          defaultRouteOn = !defaultRouteOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-fail]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          failoverOn = !failoverOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-hold]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          holdOn = !holdOn;
          if (!holdOn) heldNow = false;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-reset]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          heldNow = false;
          show(current === "hold" ? "off" : current, true);
        };
      });
      sceneEl.querySelectorAll("[data-defaults]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          multi = false;
          holdOn = false;
          defaultRouteOn = true;
          failoverOn = true;
          splitOn = false;
          sharedSocks = true;
          simpleOn = false;
          dockMode = "window";
          reconnectOn = true;
          socksPort = 1080;
          heldNow = false;
          extIPOn = true;
          loftMode = "link";
          editTab = "main";
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-settab]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          setTab = el.dataset.settab || "gen";
          show("set", true);
        };
      });
      try {
        const u = new URL(location.href);
        u.searchParams.set("scene", name);
        u.searchParams.set("lang", lang);
        u.searchParams.set("multi", multi ? "1" : "0");
        u.searchParams.set("region", regionTab);
        u.searchParams.set("zid", editingZoneId);
        u.searchParams.set("sfmt", splitFmt);
        u.searchParams.set("split", splitOn ? "1" : "0");
        u.searchParams.set("socks", sharedSocks ? "1" : "0");
        u.searchParams.set("sport", String(socksPort));
        u.searchParams.set("simple", simpleOn ? "1" : "0");
        u.searchParams.set("dock", dockMode);
        u.searchParams.set("reconnect", reconnectOn ? "1" : "0");
        u.searchParams.set("settab", setTab);
        u.searchParams.set("extip", extIPOn ? "1" : "0");
        u.searchParams.set("loft", loftMode);
        u.searchParams.set("edittab", editTab);
        history.replaceState(null, "", u);
      } catch (_) {}
    }

    function setLang(next) {
      lang = next;
      paintBoard();
      show(current);
    }

    document.querySelectorAll("nav button[data-scene]").forEach((b) => {
      b.onclick = () => show(b.dataset.scene);
    });
    document.querySelectorAll(".lang button").forEach((b) => {
      b.onclick = () => setLang(b.dataset.lang);
    });
    window.__show = show;
    mb.onclick = () => show(anyUp() && !heldNow ? "on" : heldNow ? "hold" : "off", true);
    mb.oncontextmenu = (ev) => { ev.preventDefault(); show("traymenu", true); };
    mb.ondblclick = () => show("main", true);

    const qScene = params.get("scene");
    try {
      paintBoard();
      show(qScene && scenes[qScene] ? qScene : "hero");
    } catch (e) {
      sceneEl.textContent = String(e && e.stack || e);
    }
  </script>

</body>
</html>
