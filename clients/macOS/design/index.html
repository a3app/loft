<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>loft — macOS client</title>
  <style>
    :root {
      --ink: #1A1714;
      --ink-2: #241f1b;
      --slate: #3A332E;
      --stone: #B7A99A;
      --copper: #C67B3A;
      --lamp: #E8B84A;
      --lamp-hi: #F3D27A;
      --snow: #F3EDE4;
      --paper: #E8DFD2;
      --mute: #8A7E72;
      --line: rgba(243,237,228,.12);
      --ok: #7dba6a;
      --err: #E24B4B;
      --ui: "Avenir Next", Avenir, "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--ui);
      background: #0e0c0b;
      color: var(--snow);
      display: grid;
      grid-template-columns: 220px 1fr;
      height: 100%;
    }
    html { scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; }

    /* ── board chrome ── */
    nav {
      border-right: 1px solid #2a2420;
      padding: 16px 12px;
      background: #14110f;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { width: 0; height: 0; }
    nav .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 8px 18px;
      font-weight: 600; letter-spacing: -0.04em; font-size: 1.15rem;
    }
    nav .brand svg { width: 28px; height: 28px; }
    nav p { margin: 0 8px 16px; color: var(--mute); font-size: 0.75rem; line-height: 1.4; }
    nav button {
      display: block; width: 100%;
      text-align: left; background: none; border: 0; color: var(--stone);
      font: 500 13px var(--ui); padding: 5px 10px; border-radius: 8px; cursor: pointer;
    }
    nav button:hover { background: #1e1a17; color: var(--snow); }
    nav button.on { background: #2a2420; color: var(--snow); }
    nav h4 {
      margin: 14px 8px 4px; font-size: 0.65rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--mute); font-weight: 600;
    }
    .lang {
      display: flex; gap: 4px; margin: 4px 8px 10px;
    }
    .lang button {
      flex: 1; text-align: center; padding: 6px 0; font-weight: 600;
      letter-spacing: 0.04em; font-size: 12px;
    }
    .lang button.on { background: var(--lamp); color: var(--ink); }

    .stage-wrap {
      padding: 28px; display: flex; align-items: center; justify-content: center;
      min-height: 0; overflow: hidden;
    }
    .desktop {
      width: min(1080px, 100%);
      aspect-ratio: 16 / 10;
      max-height: calc(100vh - 56px);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(1200px 500px at 70% -10%, #3a2a1c 0%, transparent 55%),
        radial-gradient(800px 600px at 10% 120%, #1c1814 0%, transparent 50%),
        linear-gradient(180deg, #2a221c 0%, #12100e 70%);
      box-shadow: 0 40px 80px rgba(0,0,0,.45);
    }
    .menubar {
      height: 28px;
      display: flex; align-items: center;
      padding: 0 14px;
      background: rgba(20,16,14,.55);
      backdrop-filter: blur(18px);
      color: #f4efe8;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
    }
    .menubar .left { display: flex; gap: 16px; align-items: center; }
    .menubar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
    .menubar .loft-item {
      display: flex; align-items: center; height: 22px; padding: 0 6px;
      border-radius: 5px; cursor: pointer;
    }
    .menubar .loft-item:hover, .menubar .loft-item.open { background: rgba(255,255,255,.12); }
    .menubar .loft-item svg { width: 18px; height: 18px; }

    .desktop-body { position: absolute; inset: 28px 0 0 0; }

    /* ── windows ── */
    .win, .popover {
      scrollbar-width: none;
    }
    .win::-webkit-scrollbar, .popover::-webkit-scrollbar { width: 0; height: 0; }
    .win {
      position: absolute;
      background: var(--ink);
      border: 1px solid #2e2824;
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04) inset;
      overflow: hidden;
      color: var(--snow);
    }
    .win.light {
      background: #f6f1ea;
      color: var(--ink);
      border-color: #e2d8cc;
    }
    .traffic { display: flex; gap: 7px; padding: 12px 14px 0; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .traffic .r { background: #ff5f57; }
    .traffic .y { background: #febc2e; }
    .traffic .g { background: #28c840; }
    .win h1 {
      margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.04em;
    }
    .muted { color: var(--mute); }
    .win.light .muted { color: #8a7e72; }

    /* popover */
    .popover {
      position: absolute;
      top: 8px; right: 86px;
      width: 300px;
      z-index: 6;
      background: rgba(32,28,25,.92);
      backdrop-filter: blur(28px) saturate(140%);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      color: var(--snow);
      padding: 14px 14px 10px;
    }
    .popover.light {
      background: rgba(246,241,234,.94);
      color: var(--ink);
      border-color: rgba(0,0,0,.06);
    }
    .popover::before {
      content: "";
      position: absolute; top: -6px; right: 48px;
      width: 12px; height: 12px;
      background: inherit;
      transform: rotate(45deg);
      border-left: 1px solid rgba(255,255,255,.08);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .pop-head { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .pop-head .mark { width: 36px; height: 36px; }
    .pop-head .t { font-weight: 600; letter-spacing: -0.03em; font-size: 15px; }
    .pop-head .s { font-size: 12px; color: var(--mute); }
    .pop-rate { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--mute); line-height: 1.35; }
    .btn {
      width: 100%; border: 0; border-radius: 10px;
      padding: 11px 14px; font: 600 14px var(--ui);
      letter-spacing: -0.02em; cursor: pointer;
      transition: filter 0.08s ease, transform 0.08s ease;
    }
    .btn:active {
      filter: brightness(0.78);
      transform: scale(0.96);
    }
    .btn.connect { background: var(--slate); color: var(--snow); }
    .btn.connect.on { background: var(--lamp); color: var(--ink); }
    .btn.ghost { background: transparent; color: var(--mute); font-weight: 500; font-size: 12.5px; }
    .rows { margin: 12px 0 4px; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12.5px; padding: 6px 2px;
    }
    .row .k { color: var(--mute); }
    .row .v { font-family: var(--mono); font-size: 11.5px; }
    .spark { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mute); padding: 8px 2px 4px; }
    .spark .err { color: var(--err); }
    .pop-foot {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px;
    }
    .pop-foot a { color: var(--stone); text-decoration: none; font-size: 12.5px; }

    /* main window */
    .main {
      width: 400px; height: 500px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .main.aside {
      left: 38%;
    }
    .win.main.simple, .win.conns.simple {
      height: auto;
      max-height: calc(100% - 24px);
    }
    .win.main.simple .body { padding-bottom: 22px; }
    .foot {
      margin-top: 18px; font-size: 11.5px; color: var(--mute); text-align: center;
    }
    .main .body { padding: 8px 22px 22px; }
    .hero {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 12px 0 18px;
    }
    .hero .mark { width: 72px; height: 72px; margin-bottom: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: var(--mute);
      background: #211c19; border-radius: 99px; padding: 4px 10px; margin-top: 8px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
    .dot.on { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
    .dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin: 16px 0;
    }
    .stat {
      background: #211c19; border-radius: 10px; padding: 10px 10px 8px;
    }
    .stat .k { font-size: 10.5px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
    .stat .v { font-family: var(--mono); font-size: 12px; margin-top: 4px; }
    .list { margin-top: 6px; }
    .item {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
      padding: 10px 10px; border-radius: 10px; cursor: pointer;
    }
    .item:hover { background: #211c19; }
    .item .n { font-size: 13.5px; font-weight: 600; letter-spacing: -0.02em; }
    .item .u { font-size: 11.5px; color: var(--mute); font-family: var(--mono); }
    .item .tag { font-size: 10.5px; color: var(--stone); align-self: center; }
    .item.live { background: #211c19; }
    .item.live .tag { color: var(--lamp); }
    .item.err .tag, .item .u.err { color: var(--err); }

    /* onboarding */
    .onb {
      width: 440px; height: 520px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .onb.tall { height: 580px; }
    .onb .body { padding: 8px 36px 28px; text-align: center; }
    .onb .mark { display: block; width: 64px; height: 64px; margin: 8px auto 12px; }
    .onb p { color: var(--mute); font-size: 13.5px; line-height: 1.5; }
    .field {
      width: 100%; margin: 18px 0 8px;
      background: #211c19; border: 1px solid #3a332e; border-radius: 10px;
      padding: 12px 14px; color: var(--snow); font: 500 14px var(--mono);
      outline: none;
    }
    .field:focus { border-color: var(--lamp); }
    .hint { font-size: 12px; color: var(--mute); text-align: left; }
    .steps { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
    .label { font-size: 11.5px; color: var(--mute); text-align: left; margin: 14px 0 6px; }
    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1; border: 1px solid #3a332e; background: #211c19; color: var(--stone);
      border-radius: 9px; padding: 9px 8px; font: 600 12.5px var(--ui); cursor: pointer;
    }
    .seg button.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
    .rate-bits { display: flex; flex-direction: column; gap: 4px; }
    .rate-bits button {
      min-width: 72px; padding: 3px 8px; font: 600 11px var(--ui);
      border-radius: 7px; border: 1px solid #3a332e; background: #211c19;
      color: var(--stone); cursor: pointer;
    }
    .rate-bits button.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
    .loft-select {
      appearance: none; -webkit-appearance: none;
      min-width: 168px; max-width: 200px;
      background: #211c19 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='%238A7E72' d='M0 0l5 6 5-6z'/></svg>") no-repeat right 10px center;
      color: var(--snow); border: 1px solid #3a332e; border-radius: 10px;
      padding: 7px 28px 7px 12px; font: 600 12.5px var(--ui); cursor: pointer;
    }
    .field.sm { margin: 0; padding: 10px 12px; font-size: 13px; }
    .btn.back { background: transparent; color: var(--mute); font-weight: 500; margin-top: 8px; }

    /* settings */
    .sheet {
      width: 440px; height: auto; max-height: calc(100% - 24px);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .sheet .body { padding: 0 22px 12px; }
    .sheet h1 { margin: 14px 0 8px; font-size: 1.2rem; }
    .sheet .head-row { margin: 14px 0 8px; align-items: center; }
    .sheet .head-row h1 { margin: 0; line-height: 28px; }
    .sheet .head-row .btn { height: 28px; box-sizing: border-box; display: inline-flex; align-items: center; }
    .pref { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .pref .n { font-size: 13.5px; }
    .pref .d { font-size: 11.5px; color: var(--mute); line-height: 1.3; max-width: 280px; }
    .pref-group {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--mute); font-weight: 600; margin: 8px 0 0;
    }
    .sheet-foot { padding-top: 10px; margin-top: 4px; }
    .pref.pick { cursor: pointer; }
    .pref .chev { color: var(--mute); font-size: 16px; }

    .win.split {
      width: 440px; height: 520px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
    }
    .win.split .body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 4px 20px 0;
    }
    .win.split h1 { margin: 4px 0 2px; font-size: 1.2rem; }
    .split-sub { font-size: 12.5px; color: var(--mute); margin: 0 0 6px; }
    .split-native { font: 500 11.5px var(--mono); color: var(--stone); margin: 0 0 10px; }
    .split-list.dim { opacity: .4; }
    .split-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .split-tabs button {
      flex: 1; border: 1px solid #3a332e; background: #211c19; color: var(--stone);
      border-radius: 9px; padding: 7px 8px; font: 600 12px var(--ui); cursor: pointer;
    }
    .split-tabs button.on { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
    .split-tabs button .n { font-weight: 500; opacity: .7; }
    .split-list { flex: 1; min-height: 0; overflow: auto; scrollbar-width: none; }
    .split-list::-webkit-scrollbar { width: 0; height: 0; }
    .rrow {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
      padding: 8px 4px; border-bottom: 1px solid var(--line);
    }
    .rrow .n { font-size: 13.5px; font-weight: 600; }
    .rrow .u { font-size: 11.5px; color: var(--mute); font-family: var(--mono); }
    .rrow .meta { text-align: right; font-size: 11px; color: var(--mute); }
    .rrow .src { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--copper); }
    .win.split .actions {
      margin: auto -20px 0;
      padding: 12px 20px 14px;
      border-top: 1px solid var(--line);
    }
    .fmt {
      font-family: var(--mono); font-size: 11px; background: #211c19;
      border-radius: 8px; padding: 10px 12px; margin: 10px 0; text-align: left;
      white-space: pre-wrap; line-height: 1.45; color: var(--stone);
    }
    .route-tag {
      display: inline-block; margin-left: 6px;
      font-size: 10px; font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; color: var(--lamp); vertical-align: 1px;
    }
    .pop-badge {
      display: inline-block; margin-left: 6px;
      font-size: 10px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--ink); background: var(--lamp);
      border-radius: 3.5px; padding: 2px 7px; vertical-align: middle; line-height: 1.15;
    }
    .toggle { width: 36px; height: 22px; border-radius: 11px; background: #3a332e; position: relative; transition: background-color .2s ease; }
    .toggle.on { background: var(--lamp); }
    .toggle i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s ease; }
    .toggle.on i { left: 16px; }

    .about {
      width: 360px; height: 360px; left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center; display: flex; flex-direction: column;
    }
    .about .body {
      padding: 8px 32px 14px;
      display: flex; flex-direction: column;
      min-height: 0; flex: 1;
    }
    .about .mark { width: 72px; height: 72px; margin: 8px auto 10px; }
    .about .ver { margin: 2px 0 0; font-size: 12.5px; color: var(--mute); }
    .about .spec-cap {
      margin: 20px 0 6px; font-size: 11px; color: var(--mute); font-weight: 500;
    }
    .about .spec {
      display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
      width: 100%; margin: 0; box-sizing: border-box;
      text-align: left; font-size: 12.5px;
    }
    .about .spec .k { color: var(--mute); }
    .about .spec .v { font-family: var(--mono); font-size: 12px; }
    .about .blurb {
      margin: auto 0; font-size: 13.5px; line-height: 1.45;
      letter-spacing: -0.02em; color: var(--stone); font-weight: 500;
    }
    .about .madeby {
      margin-top: 0; font-size: 12px; font-weight: 500;
      color: var(--mute); letter-spacing: -0.01em;
    }
    .about .madeby .heart {
      color: var(--lamp); vertical-align: -1px; margin: 0 3px;
    }
    .about .madeby sup { font-size: 0.65em; }

    .hide { display: none !important; }

    /* mark */
    .mark .body { fill: #B7A99A; }
    .mark .lamp { fill: #3A332E; }
    .mark.on .lamp { fill: var(--lamp); }
    .mark.err .lamp { fill: var(--err); }
    .mark.ink .body { fill: var(--ink); }
    .mark.ink.on .lamp { fill: var(--lamp); }
    .mb-mark { color: #f4efe8; }
    .mb-mark .body { fill: currentColor; }
    .mb-mark .lamp { fill: #3a332e; }
    .mb-mark.on .lamp { fill: var(--lamp); filter: drop-shadow(0 0 2px var(--lamp-hi)); }
    .mb-mark.err .lamp { fill: var(--err); filter: drop-shadow(0 0 2px var(--err)); }
    .btn.connect.err { background: var(--slate); color: var(--snow); }
    .btn.reset {
      background: var(--slate); color: var(--snow);
      margin-top: 6px;
    }
    .popover .list + .btn.reset, .popover .btn.reset:first-of-type { margin-top: 0; margin-bottom: 10px; }

    .pick { cursor: pointer; }
    .pick .v { color: var(--stone); }
    .chev { opacity: .5; margin-left: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions .btn { padding: 9px 10px; font-size: 12.5px; background: #211c19; color: var(--snow); }
    .win.conns { display: flex; flex-direction: column; }
    .win.conns .body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 8px 20px 0;
    }
    .win.conns .list { flex: 1; min-height: 0; overflow: auto; scrollbar-width: none; }
    .win.conns .list::-webkit-scrollbar { width: 0; height: 0; }
    .win.conns .actions {
      margin: auto -20px 0;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--line);
    }
    .drop {
      margin-top: 16px; border: 1px dashed #3a332e; border-radius: 12px;
      padding: 28px 16px; text-align: center; color: var(--mute); font-size: 13px; line-height: 1.45;
    }
    .drop strong { color: var(--stone); font-weight: 600; }
    .file {
      font-family: var(--mono); font-size: 11.5px; background: #211c19;
      border-radius: 8px; padding: 12px 14px; margin-top: 14px; text-align: left;
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; overflow: hidden;
    }
    .warn { font-size: 12px; color: var(--copper); text-align: left; margin-top: 12px; line-height: 1.45; }
    .plist .item { grid-template-columns: 8px 1fr auto; align-items: center; }
    .plist .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .plist .side-btns { display: flex; gap: 2px; align-items: center; }
    .plist .side-btns:empty { display: none; }
    .win.conns { width: 400px; height: 520px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .win.conns h1 { margin: 8px 0 0; }
    .win.conns.simple .head-row { margin-bottom: 8px; }
    .subline { font-size: 12.5px; color: var(--mute); margin: 4px 0 12px; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .multi-switch {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px;
      margin-top: 8px;
      white-space: nowrap;
      cursor: pointer;
    }
    .multi-cap {
      font-size: 12.5px; font-weight: 500; color: var(--mute);
      line-height: 1; white-space: nowrap;
    }
    .mini {
      border: 0; border-radius: 8px; padding: 6px 10px; font: 600 11.5px var(--ui);
      background: var(--slate); color: var(--snow); cursor: pointer; white-space: nowrap;
    }
    .mini.on { background: var(--lamp); color: var(--ink); }
    .plist.sess .item { padding: 8px 6px; }
    .pop-head .s.err { color: var(--err); }
    .ghost-sm { background: none; border: 0; color: var(--mute); font: 500 11.5px var(--ui); cursor: pointer; padding: 4px 6px; }
    .toggle { cursor: pointer; flex-shrink: 0; }

    .edit-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .edit-foot {
      margin-top: 8px; padding-top: 10px;
      border-top: 1px solid var(--line); flex-shrink: 0;
    }
    .edit-foot .btn.connect { margin: 0; }
    .edit-alt { display: flex; justify-content: space-between; gap: 8px; }
    .edit-alt .btn { width: auto; flex: 1; margin-top: 2px; }

              </div>` : `<div class="spark" style="padding:12px 2px 0"><span>↑ 12 kb/s</span><span>↓ 48 kb/s</span></div>`}`}

          </div>
        </div>`;
    }

    const sceneEl = document.getElementById("scene");
    const mb = document.getElementById("mb-loft");

    function paintBoard() {
      document.documentElement.lang = lang;
      document.getElementById("board-sub").textContent = t("board.sub");
      document.getElementById("board-lang").textContent = t("board.lang");
      document.getElementById("board-scenes").textContent = t("board.scenes");
      document.querySelectorAll("nav button[data-i18n]").forEach((b) => {
        b.textContent = t(b.dataset.i18n);
      });
      document.querySelectorAll(".lang button").forEach((b) => {
        b.classList.toggle("on", b.dataset.lang === lang);
      });
    }

    function paintMenuLamp(name) {
      const svg = document.getElementById("mb-svg");
      svg.classList.remove("on", "err");
      const hide = ["onboard", "url", "about", "import", "export"].includes(name);
      let st = "off";
      if (hide) st = "off";
      else if (heldNow || name === "hold" || name === "err" || (multi && name !== "off" && anyErr())) st = "err";
      else if (multi) st = name !== "off" && anyUp() ? "on" : "off";
      else if (["on", "hero", "main", "out", "switch", "list", "edit", "editvless"].includes(name)) st = "on";
      if (st !== "off") svg.classList.add(st);
      svg.style.opacity = "1";
    }

    function show(name, keep) {
      current = name;
      if (!keep) {
        PROFILES.forEach((p) => {
          p.err = false;
          p.up = p.id === "office" || p.id === "lab";
        });
      }
      if (name === "err") {
        const lab = PROFILES.find((p) => p.id === "lab");
        lab.err = true;
        lab.up = false;
      }
      if (name === "hold") {
        PROFILES.forEach((p) => { p.up = false; p.err = false; });
        heldNow = true;
      } else if (!keep) {
        heldNow = name === "off" && holdOn;
      }
      sceneEl.innerHTML = scenes[name]();
      document.querySelectorAll("nav button[data-scene]").forEach((b) => b.classList.toggle("on", b.dataset.scene === name));
      mb.classList.toggle("open", name === "on" || name === "off" || name === "hero" || name === "switch" || name === "err" || name === "hold");
      paintMenuLamp(name);
      sceneEl.querySelectorAll("[data-go]").forEach((b) => {
        b.onclick = () => show(b.dataset.go);
      });
      sceneEl.querySelectorAll(".seg").forEach((seg) => {
        seg.querySelectorAll("button").forEach((b) => {
          b.onclick = () => {
            seg.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
            b.classList.add("on");
          };
        });
      });
      sceneEl.querySelectorAll("[data-vless-mode]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          vlessMode = el.dataset.vlessMode === "manual" ? "manual" : "link";
          show("editvless", true);
        };
      });
      sceneEl.querySelectorAll("[data-stab]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          splitTab = el.dataset.stab;
          if (current === "split" || current === "splitout") show(current, true);
          else {
            const wrap = el.closest(".seg, .split-tabs");
            if (wrap) wrap.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === el));
          }
        };
      });
      sceneEl.querySelectorAll("[data-sfmt]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          splitFmt = el.dataset.sfmt;
          show("splitout", true);
        };
      });
      sceneEl.querySelectorAll("[data-sauto]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          splitAuto = !splitAuto;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-split]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          splitOn = !splitOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-socks]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          sharedSocks = !sharedSocks;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-simple]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          simpleOn = !simpleOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-dock]").forEach((el) => {
        el.onchange = (ev) => {
          ev.stopPropagation();
          dockMode = el.value || "window";
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-uilang]").forEach((el) => {
        el.onchange = (ev) => {
          ev.stopPropagation();
          setLang(el.value === "en" ? "en" : "ru");
        };
      });
      sceneEl.querySelectorAll("[data-profile]").forEach((el) => {
        el.onclick = (ev) => {
          if (ev.target.closest("[data-toggle],[data-edit],[data-retry]")) return;
          if (multi) {
            editingId = el.dataset.profile;
            if (current === "list" || current === "main") show("edit");
            return;
          }
          activeId = el.dataset.profile;
          show(current === "switch" ? "on" : current);
        };
      });
      sceneEl.querySelectorAll("[data-toggle]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          const p = PROFILES.find((x) => x.id === b.dataset.toggle);
          if (p) {
            p.up = !p.up;
            p.err = false;
          }
          if (holdOn && liveTuns().length === 0) heldNow = true;
          if (liveTuns().length > 0) heldNow = false;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-retry]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          const p = PROFILES.find((x) => x.id === b.dataset.retry);
          if (p) {
            p.err = false;
            p.up = true;
          }
          show("on");
        };
      });
      sceneEl.querySelectorAll("[data-edit]").forEach((b) => {
        b.onclick = (ev) => {
          ev.stopPropagation();
          editingId = b.dataset.edit;
          show("edit");
        };
      });
      sceneEl.querySelectorAll("[data-multi]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          multi = !multi;
          if (!multi) {
            const firstUp = PROFILES.find((x) => x.up);
            if (firstUp) activeId = firstUp.id;
          }
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-reconnect]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          reconnectOn = !reconnectOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-tun]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const p = PROFILES.find((x) => x.id === el.dataset.tun);
          if (p) p.tun = !p.tun;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-defroute]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          defaultRouteOn = !defaultRouteOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-fail]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          failoverOn = !failoverOn;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-hold]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          holdOn = !holdOn;
          if (!holdOn) heldNow = false;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-reset]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          heldNow = false;
          show("off", true);
        };
      });
      sceneEl.querySelectorAll("[data-defaults]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          multi = false;
          holdOn = false;
          defaultRouteOn = true;
          failoverOn = true;
          splitOn = false;
          sharedSocks = true;
          simpleOn = false;
          dockMode = "window";
          reconnectOn = true;
          socksPort = 1080;
          heldNow = false;
          show(current, true);
        };
      });
      sceneEl.querySelectorAll("[data-settab]").forEach((el) => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          setTab = el.dataset.settab || "gen";
          show("set", true);
        };
      });
      try {
        const u = new URL(location.href);
        u.searchParams.set("scene", name);
        u.searchParams.set("lang", lang);
        u.searchParams.set("multi", multi ? "1" : "0");
        u.searchParams.set("stab", splitTab);
        u.searchParams.set("sfmt", splitFmt);
        u.searchParams.set("split", splitOn ? "1" : "0");
        u.searchParams.set("socks", sharedSocks ? "1" : "0");
        u.searchParams.set("sport", String(socksPort));
        u.searchParams.set("simple", simpleOn ? "1" : "0");
        u.searchParams.set("dock", dockMode);
        u.searchParams.set("reconnect", reconnectOn ? "1" : "0");
        u.searchParams.set("settab", setTab);
        history.replaceState(null, "", u);
      } catch (_) {}
    }

    function setLang(next) {
      lang = next;
      paintBoard();
      show(current);
    }

    document.querySelectorAll("nav button[data-scene]").forEach((b) => {
      b.onclick = () => show(b.dataset.scene);
    });
    document.querySelectorAll(".lang button").forEach((b) => {
      b.onclick = () => setLang(b.dataset.lang);
    });

    const qScene = params.get("scene");
    try {
      paintBoard();
      show(qScene && scenes[qScene] ? qScene : "hero");
    } catch (e) {
      sceneEl.textContent = String(e && e.stack || e);
    }
  </script>

</body>
</html>
