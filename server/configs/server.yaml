listen: ":443"
cert: /etc/loft/fullchain.pem
key: /etc/loft/privkey.pem
token: "change-me-long-random"

# Optional real website root. Empty = built-in cover page.
cover_dir: ""

get_path: /static/v3/build
# get_down: 262144   # GET body bytes (Status get_down). omit = 256 KiB. 16 KiB..1 MiB.
# pad_max: 8         # idle pad GETs in flight (Status pad_max). omit = 8. 1..16.
ws_path: /api/v1/sync
h2_path: /api/v1/tunnel
h3_path: /api/v1/tunnel

# fronts: omit or [get] = public GET path. List ws, h2, quic, h3 to opt in.
# connect is HTTP CONNECT splice (mux-off TCP); off unless listed.
fronts: [get]
# fronts: [get, ws, h2, quic, h3]
# fronts: [get, ws, h2, quic, h3, connect]

# inner: extra data ciphers the node may confirm. ChaCha20-Poly1305 is always
# on and cannot be disabled. GET never confirms extras. Direct fronts
# (ws, h2, quic, h3, l3) may, when the client asked. Same boxes on the panel
# Node screen. Empty = ChaCha only.
# inner: [clear, aes, aegis, hiae]

# decoy: this node's identity. Unauthorized TCP (any SNI, including the
# advertise hostname) and UDP/443 are spliced here — an active probe sees
# that origin's live TLS/QUIC. First entry is what the node "is".
# Empty list = off.
decoy:
  - www.google.com:443

# cidrs that may complete TLS on own SNI without session_id (CDN origin pull).
# Empty = every own-SNI probe is spliced.
# cdn_peers:
#   - 77.88.0.0/16

# mask: loft TLS wears a dest-shaped leaf (probes still splice).
mask: true

role: controller
advertise: https://controller.example
roster_path: /static/v3/manifest.json
lists_path: /static/v3/lists.json

# named address lists; the client maps names to direct/via/drop
# lists:
#   yandex:
#     - yandex.ru
#     - .yandex.ru
#   youtube:
#     - youtube.com
#     - .googlevideo.com
#   direct:
#     - .ru
#   drop:
#     - ads.example

# relays: allowlist for enrol (id must match). Live roster = advertise + heartbeats.
enrol: list
# auth_shared: false
#   false (default): clients use members.keys. Empty ring does not accept LOFT_TOKEN.
#   true: empty members.keys → LOFT_TOKEN is the client secret (old one-token overlay).
#   A non-empty ring never mixes LOFT_TOKEN, even when this is true.
# relays:
#   - id: ru1
#     url: https://203.0.113.10
#     decoy: www.google.com:443
#     fronts: [get]
#     weight: 100

# extra node addresses the client may fail over to (host:port, unsigned)
# replicas:
#   - 203.0.113.10:443

# session event log (GET seq / 404 / silence). Empty = off. Not on the public path.
# Join with a client -drive log on seq + UTC. sid is truncated.
# trace: /var/log/loft-sess.log

# quic_alpn: h3   # default; do not use "loft"

# edge: plain | tight
# tight: GET behind an edge that drops a fat concurrent Cookie burst.
# Status tells the client after the handshake. Empty is plain.
# cdn: yandex still selects tight when edge is empty.
# edge: tight

# canary: path-integrity testimony for TLS. Chrome-shaped ClientHello
# through CDNs, reverse proxies, and TLS middleboxes. Does not hide SNI.
canary:
  fat_hello: true    # Chrome-sized ClientHello (default)
  split_hello: false # two TLS records for ClientHello; node reassembles
  pad: 0             # extra padding bytes, 0–2048
