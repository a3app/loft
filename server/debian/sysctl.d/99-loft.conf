# UDP buffers for QUIC / HTTP/3 on :443. quic-go wants about 7.5 MiB.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
# Unprivileged ICMP echo (SOCK_DGRAM IPPROTO_ICMP) for loft-node as user loft.
net.ipv4.ping_group_range = 0 2147483647
# BBR for user loft ("cc bbr" in node.conf). tcp_bbr loads from modules-load.d.
net.ipv4.tcp_allowed_congestion_control = reno cubic bbr
