network loft
name loft
enable
ipif overlay 10.8.0.0/24
  gateway 10.8.0.1
  mtu 1280
  peers hub
  p2p disable
  dns enable
  dns 10.8.0.1
  dns upstream https://1.1.1.1/dns-query
  dns upstream tls://1.1.1.1
  listen 0.0.0.0 443 front ws
create member operator
config member operator multi enable 8
enable member operator
