# loft-node — Debian controller.
# Token lives in /etc/loft/loft.env (LOFT_TOKEN). Do not put it here.

role controller
listen :443
cert /etc/loft/tls/fullchain.pem
key /etc/loft/tls/privkey.pem
get_path /static/js
ws_path /api/v1/sync
h2_path /api/v1/tunnel
h3_path /api/v1/tunnel
advertise https://controller.example
roster_path /static/v3/manifest.json
lists_path /static/v3/lists.json
enrol list
keep_keys enable
mask disable
canary fat_hello enable
canary split_hello disable
canary pad 0
