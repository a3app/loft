<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Edge Static</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #f6f7fb; color: #111; }
    header { background: #fff; border-bottom: 1px solid #e6e8ef; padding: 20px 32px; }
    main { max-width: 720px; margin: 48px auto; padding: 0 20px; }
    h1 { font-size: 28px; font-weight: 650; }
    p { line-height: 1.6; color: #444; }
    .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  </style>
</head>
<body>
  <header>Edge Static</header>
  <main>
    <div class="card">
      <h1>Delivery node</h1>
      <p>This host serves static assets for web clients. If you expected an application, check the URL or try again later.</p>
    </div>
  </main>
</body>
</html>
