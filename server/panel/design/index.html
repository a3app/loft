<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>loft — panel</title>
<style>
/* Каркас: тёмная планка 64px во всю ширину; под ней меню 264px (свёрнуто 72px) и прокручиваемая страница.
   Точки перелома: ≤599 телефон (меню на весь экран по ☰), 600–959 планшет, ≥960 десктоп. Один светлый вид loft. */
:root{
  --ink:#1A1714; --menu:#211D19; --menu-hover:#2A2520; --menu-on:#3A332C; --menu-line:rgba(243,237,228,.1);
  --menu-text:#D9CFC2; --menu-mute:#A69A8C; --lamp:#E8B84A; --snow:#F3EDE4;
  --bg:#F3EDE4; --surface:#FBF8F3; --field:#FFFDF9; --th:#ECE4D8; --line:#E2D8CA; --line-soft:#EEE6DA; --stroke:#CFC4B6;
  --text:#1A1714; --text-2:#3A332C; --mute:#6B6157; --link:#8A4E1C;
  --ok-bg:#F6E7BF; --ok-fg:#5A430E; --warn-bg:#F3DCC6; --warn-fg:#7A3F12; --bad:#8A1F17; --off:#8A7E72;
  --sans:"Avenir Next",Avenir,"Helvetica Neue","Segoe UI",ui-sans-serif,system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,ui-monospace,monospace;
  --hdr:64px; --side:264px; --rail:72px;
  color-scheme:light;
}
/* своя страница, без внешнего каркаса: сброс отступов и прокрутка только в .main */
html,body{height:100%;margin:0;padding:0;overflow:hidden}
img{max-width:100%}
body{background:var(--bg);color:var(--text);font:400 14px/22px var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--link)}
button{font:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.mono{font-family:var(--mono);font-size:13px}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* ── каркас ── */
.app{height:100%;display:flex;flex-direction:column}
.hdr{flex:0 0 var(--hdr);height:var(--hdr);display:flex;align-items:center;gap:16px;padding:0 32px 0 0;background:var(--ink);color:var(--snow);position:relative;z-index:30;box-shadow:0 2px 6px rgba(26,23,20,.35)}
.hdr-toggle{display:none;width:64px;height:64px;flex:0 0 64px;align-items:center;justify-content:center;border:0;background:var(--menu);color:var(--snow);cursor:pointer}
.hdr-toggle:hover{background:var(--menu-hover)}
.hdr-brand{display:flex;align-items:center;gap:10px;padding-left:32px;color:var(--snow);text-decoration:none;min-width:0}
.hdr-brand b{font-size:22px;font-weight:600;letter-spacing:-.04em}
.hdr-host{font-size:12px;color:var(--menu-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-ctl{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-ic{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--lamp);cursor:pointer}
.hdr-ic:hover{background:var(--menu-hover)}
.hdr-pill{min-height:36px;padding:0 12px;border:1px solid #3A332C;border-radius:4px;background:transparent;color:var(--snow);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.hdr-ctl{position:relative}
.sr{display:flex;flex-direction:column;gap:2px;margin:0 -12px}
.sr-g{padding:10px 12px 4px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sr-i{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:4px;background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.sr-i span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-i.on,.sr-i:hover{background:var(--th)}
.helpd-back{position:fixed;inset:0;z-index:60;background:rgba(26,23,20,.35)}
.helpd{position:fixed;top:0;right:0;bottom:0;z-index:61;width:420px;max-width:100%;overflow-y:auto;padding:24px 32px 40px;background:var(--surface);box-shadow:-12px 0 40px rgba(26,23,20,.25)}
.helpd h2{margin:0 40px 12px 0;font-size:22px;line-height:30px}
.helpd h3{margin:24px 0 8px;font-size:15px}
.helpd ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--text-2)}
.helpd .icb{position:absolute;top:20px;right:20px}
@media (max-width:720px){.helpd{padding:20px 16px 32px}}
.umenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:200px;padding:6px 0;background:var(--menu);border:1px solid #3A332C;border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.umenu a,.umenu button{display:block;width:100%;padding:10px 16px;border:0;background:none;color:var(--snow);font:inherit;font-size:14px;text-align:left;text-decoration:none;cursor:pointer}
.umenu a:hover,.umenu button:hover{background:var(--menu-hover)}
select.hdr-pill{color-scheme:dark;padding-right:8px}

.body{flex:1 1 auto;min-height:0;display:flex;position:relative}
.side{flex:0 0 var(--side);width:var(--side);display:flex;flex-direction:column;background:var(--menu);color:var(--menu-text);min-height:0;z-index:20}
.side-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:#4A423A transparent}
.grp-h{display:flex;align-items:center;min-height:52px;padding:16px 24px 8px 0;color:var(--lamp);font-size:12px;line-height:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.grp-h svg{flex:0 0 24px;margin:0 12px 0 24px;overflow:visible}
.fold svg{overflow:visible}
.lnk{display:flex;align-items:center;min-height:36px;padding:6px 24px 6px 60px;color:var(--menu-text);text-decoration:none;white-space:nowrap}
.lnk:hover{background:var(--menu-hover);color:var(--snow)}
.lnk.on{background:var(--menu-on);color:var(--snow)}
.side-foot{flex:0 0 64px;display:flex;align-items:center;border-top:1px solid var(--menu-line)}
.fold{display:flex;align-items:center;gap:12px;width:100%;height:64px;padding:0 24px;border:0;background:transparent;color:var(--lamp);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.fold:hover{background:var(--menu-hover)}
.side-mob{display:none}
/* свёрнутое меню: только значки групп */
.app.rail .side{flex-basis:var(--rail);width:var(--rail)}
.app.rail .grp-h{justify-content:center;padding:0;min-height:72px;border-top:1px solid var(--menu-line)}
.app.rail .grp:first-child .grp-h{border-top:0}
.app.rail .grp-h svg{margin:0}
.app.rail .grp-h span,.app.rail .lnk,.app.rail .fold span{display:none}
.app.rail .grp.on .grp-h{background:var(--menu-on)}
.app.rail .fold{justify-content:center;padding:0}
.app.rail .grp-h{cursor:pointer}

.main{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.main>.page{flex:1 0 auto;width:100%;box-sizing:border-box}
/* Footer: version (opens About) and the author line, at the end of the page. */
.foot{margin-top:auto;max-width:1600px;width:100%;box-sizing:border-box;padding:14px 32px 18px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;color:var(--mute);font-size:12px;line-height:1.45}
.foot-copy{text-align:right}
.foot-about{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}
.foot-about:hover{color:var(--link);text-decoration:underline}
.madeby{margin-top:3px;opacity:.9}
.madeby svg{color:var(--lamp);vertical-align:-1px;margin:0 1px}
.madeby sup,.about sup{font-size:.72em;margin-left:-.14em;vertical-align:.42em}
.about{max-width:860px}
.about p{margin:0 0 10px;line-height:1.5;max-width:640px}
.about h3{margin:18px 0 6px;font-size:15px}
.about-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.about-oss{display:flex;flex-direction:column;gap:2px;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.about-oss b{font-size:13px}
.about-oss span{font-size:12px;color:var(--mute);line-height:1.35}
.page{max-width:1600px;padding:0 32px 56px}
.page-h{display:flex;align-items:center;gap:8px;padding-top:32px;margin-bottom:8px}
.page-h h1{margin:0;font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.help{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--mute);cursor:pointer;padding:0}
.crumb{display:inline-flex;align-items:center;gap:6px;min-height:32px;margin-top:24px;color:var(--link);text-decoration:none;font-weight:500}
.crumb+.page-h{padding-top:4px}
.page-d{margin:0 0 24px;max-width:860px;color:var(--text-2)}
.more{display:none;border:0;background:transparent;color:var(--link);padding:0;cursor:pointer;margin:-20px 0 20px;min-height:28px}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 28px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;min-height:44px;padding:0;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--mute);font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--ink)}
.tabs+.tabs{margin-top:-12px}
.tab.plus{color:var(--link);min-width:44px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center}
.tab.plus svg{width:20px;height:20px}

.blk{margin-bottom:40px;min-width:0}
.blk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.blk-h h2{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.blk-side{margin-left:auto;display:flex;gap:8px;align-items:center}
.blk-d{margin:0 0 16px;max-width:860px;color:var(--text-2)}
.acts{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:92px;height:40px;padding:0 20px;border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--th)}
.btn.pri{background:var(--ink);color:var(--snow)}
.btn.pri:hover{background:#2E2822}
.btn.sm{height:32px;padding:0 14px;gap:8px;min-width:0;font-size:13px}
.btn.ghost{border-color:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icb{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--mute);cursor:pointer;flex:0 0 40px}
.icb:hover{background:var(--th);color:var(--text)}
.icb.del:hover{color:var(--bad)}

/* таблица: шапка и строки по 48, прокрутка вбок в своей обёртке, первая колонка закреплена */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table.t{width:100%;border-spacing:0;font-size:14px}
.t th{height:48px;padding:6px 12px;background:var(--th);text-align:left;font-weight:600;font-size:13px;color:var(--text-2);white-space:nowrap}
.t td{height:48px;padding:6px 10px 6px 12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.t th:first-child,.t td:first-child{position:sticky;left:0;z-index:1}
.t th:first-child{background:var(--th)}
.t td:first-child{background:var(--surface);box-shadow:1px 0 0 var(--line-soft)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#F6F1E9}
.t .grp td{height:36px;background:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.t .sub{display:block;font-size:12px;line-height:16px;color:var(--mute);white-space:normal;max-width:520px}
.t .r{text-align:right}
.cell-acts{display:flex;align-items:center;justify-content:flex-end;gap:4px}

.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--th);color:var(--text-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.busy{background:var(--ink);color:var(--snow)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;background:var(--off);margin-right:8px;vertical-align:1px}
.dot.on{background:#C9952B}

.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:36px;height:20px;border-radius:10px;background:var(--stroke);position:relative;flex:0 0 36px;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--ink)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--lamp);outline-offset:2px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .sw{flex:0 0 auto}
.who-t{display:flex;flex-direction:column;min-width:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-h h2{margin:0;font-size:15px;line-height:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card-h .pill{margin-left:auto}
.kv{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px 24px}
.kv dt{font-size:12px;line-height:18px;color:var(--mute)}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.big{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-.02em}
.ev{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--line-soft)}
.ev:first-child{border-top:0}
.ev time{flex:0 0 96px;color:var(--mute);font-size:13px}

.joblog{background:var(--ink);color:#CFC4B6;border-radius:4px;padding:12px 14px;font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-x:auto}
.bar{height:4px;background:var(--th);border-radius:2px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;width:40%;background:var(--ink);animation:run 1.4s linear infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;margin-left:30%}}

.rule{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:48px;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.rule:first-child{border-top:0}
.rule .n{width:24px;height:24px;border-radius:12px;background:var(--th);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 24px}
.rule .tail{margin-left:auto;font-size:12px;color:var(--mute)}
.rules{border:1px solid var(--line);border-radius:4px;overflow:hidden}
tr.off td{color:var(--mute)}
.pl-wrap{display:grid;grid-template-columns:260px 1fr;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.pl-head{grid-column:1/-1;display:grid;grid-template-columns:260px 1fr 220px;background:var(--th);font-weight:600;font-size:14px}
.pl-wrap.use .pl-head{grid-template-columns:260px 1fr}
.pl-head span{padding:12px 16px}
.pl-side{border-right:1px solid var(--line)}
.pl-item{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.pl-item>div{flex:1;min-width:0}
.pl-item .sub{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.pl-item.on{box-shadow:inset 0 0 0 2px var(--text);background:var(--field)}
.pl-item.edit{flex-direction:column;align-items:stretch;gap:14px;cursor:default}
.pl-add{padding:14px 16px}
.pl-main{min-width:0}
.pl-row{display:grid;grid-template-columns:22px 28px 14px 1fr 180px 40px;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.pl-row.off{color:var(--mute)}
.pl-row .sub{display:block;font-size:12px;color:var(--mute)}
.pl-row .dot{margin:0}
.pl-lim{font-size:13px}
.drag{display:inline-grid;grid-template-columns:repeat(2,4px);gap:3px;cursor:grab;padding:2px}
.drag i{width:4px;height:4px;border-radius:2px;background:var(--stroke)}
.pl-foot{display:flex;flex-direction:column;gap:16px;padding:16px}
.pl-save{display:flex;flex-wrap:wrap;gap:16px;margin:0;padding-top:16px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.pl-sec{font-weight:600;margin:4px 0 10px}
.m-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.m-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--stroke);border-radius:4px;background:var(--field);cursor:grab;font-size:14px}
.m-chip.tag{background:var(--ok-bg);border-color:transparent}
@media (max-width:900px){.pl-wrap,.pl-head{grid-template-columns:1fr}.pl-head span:not(:first-child){display:none}.pl-side{border-right:0}.pl-row{grid-template-columns:22px 28px 14px 1fr 40px}.pl-lim{display:none}}
.plain{margin:0;padding:0 0 0 18px;line-height:1.7}

/* поля с подписью на рамке */
.fld{position:relative;margin-top:8px}
.fld label{position:absolute;top:-9px;left:10px;padding:0 4px;background:var(--surface);font-size:12px;line-height:16px;color:var(--mute);pointer-events:none}
.fld input,.fld select{width:100%;height:44px;border:1px solid var(--stroke);border-radius:4px;padding:0 44px 0 14px;background:var(--surface);color:var(--text);font:inherit;font-size:15px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fld .in-ic{position:absolute;right:2px;top:2px}
.hint{font-size:12px;line-height:18px;color:var(--mute);margin-top:6px}
.chk{display:flex;align-items:flex-start;gap:10px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink);flex:0 0 18px}
.chk-row{display:flex;flex-wrap:wrap;gap:4px 24px}

/* диалог правки: по центру 500px, на телефоне на весь экран */
.dlg-back{position:fixed;inset:0;background:rgba(26,23,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{width:500px;max-width:100%;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:6px;box-shadow:0 12px 40px rgba(26,23,20,.35)}
.dlg-top{display:flex;align-items:flex-start;gap:12px;padding:32px 16px 8px 32px}
.dlg-top h2{margin:0;font-size:22px;line-height:30px;font-weight:600;flex:1 1 auto}
.dlg-sub{padding:0 32px 8px;color:var(--text-2)}
.dlg-body{flex:1 1 auto;overflow-y:auto;padding:12px 32px 24px;display:flex;flex-direction:column;gap:18px}
.dlg-foot{display:flex;align-items:center;gap:16px;padding:16px 32px;border-top:1px solid var(--line)}
.dlg-sec{font-weight:600;font-size:15px;margin-top:6px}
/* tabs inside the member dialog, and the per-device connection cards */
.mtabs{margin:-4px 0 2px}
.mpane{display:flex;flex-direction:column;gap:18px}
.conns{display:flex;flex-direction:column;gap:12px}
.conn{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.conn-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.conn-h b{font-weight:600}
.conn-h .mono{font-size:12px;color:var(--mute)}
.conn .meta{font-size:13px;line-height:20px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.conn .meta .mono{color:var(--text)}
.conn-foot{margin-top:2px}
.dot.live{background:var(--ok-fg);margin-right:0}
.qr svg{width:168px;height:168px}
.qr{width:200px;height:200px;align-self:center;background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center}
.uri{background:var(--bg);border-radius:4px;padding:10px 12px;font:12px/1.5 var(--mono);overflow-wrap:anywhere;position:relative}
.uri.has-copy{padding-right:40px}

.led.on{background:var(--led-link);box-shadow:0 0 6px rgba(94,158,76,.7)}

.led.on.act{animation:led-act .4s steps(1,end) infinite}
.port:hover .jack{box-shadow:inset 0 0 0 1px var(--menu-mute),0 1px 0 #1A1714}

  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M5.64 5.64l1.56 1.56M16.8 16.8l1.56 1.56M3.5 12h2.2M18.3 12h2.2M5.64 18.36l1.56-1.56M16.8 7.2l1.56-1.56"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol><symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.4 17.4 0 0 1-2.9 3.9M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M5 16H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1"/></symbol>

<div class="app" id="app">
  <header class="hdr">
    <button class="hdr-toggle" id="menuBtn" type="button" aria-label="Открыть меню" aria-expanded="false"><svg width="24" height="24"><use href="#i-menu"/></svg></button>
    <a class="hdr-brand" href="#main" aria-label="loft — обзор">
      <svg width="28" height="28" viewBox="0 0 96 96" aria-hidden="true"><path fill="#F3EDE4" d="M37.7640 6.7191 A0.9600 0.9600 0 0 1 39.0071 6.7437 L57.6000 29.5200 L57.6000 63.7600 A4.4000 4.4000 0 0 0 62.0000 68.1600 L84.8000 68.1600 A3.2000 3.2000 0 0 1 88.0000 71.3600 L88.0000 86.1600 A3.8400 3.8400 0 0 1 84.1600 90.0000 L21.4400 90.0000 A3.8400 3.8400 0 0 1 17.6000 86.1600 L17.6000 29.5200 Z"/><path fill="#E8B84A" d="M31.3600 36.2400 H43.8400 A2.5600 2.5600 0 0 1 46.4000 38.8000 V55.5200 A2.5600 2.5600 0 0 1 43.8400 58.0800 H31.3600 A2.5600 2.5600 0 0 1 28.8000 55.5200 V38.8000 A2.5600 2.5600 0 0 1 31.3600 36.2400 Z"/></svg>

    </a>
    <div class="hdr-ctl">
      <button class="hdr-ic" type="button" aria-label="Поиск по панели" title="Поиск (⌘K)" onclick="openSearch()"><svg width="22" height="22"><use href="#i-search"/></svg></button>
      <label for="hLang" style="position:absolute;left:-9999px">Язык</label>
      <select class="hdr-pill" id="hLang"><option value="en">EN</option><option value="ru">RU</option><option value="zh">中文</option></select>

<script>
const MENU=[
  {id:'status',ic:'i-status',t:'Статус',items:[['main','Обзор']]},
  {id:'net',ic:'i-net',t:'Интернет',items:[['adapters','Адаптеры'],['channels','Внешние каналы'],['iface-priorities','Приоритеты подключений']]},
  {id:'loft',ic:'i-loft',t:'Сеть loft',items:[['node','Нода loft'],['members','Участники сети'],['segments','Сегменты сети']]},
  {id:'dom',ic:'i-dom',t:'Домены и почта',items:[['domains','Домены'],['mail','Почта','Почтовый сервер']]},
  {id:'adm',ic:'i-gear',t:'Управление',items:[['packages','Пакеты'],['users','Пользователи'],['system','Система'],['settings','Настройки']]}
];
const S={route:'main',tab:{users:'list',node:'main',prio:'lists'},prio:'direct',rail:false,open:false,prioDraft:null,defUse:null};
try{S.rail=localStorage.getItem('lp-rail')==='1'}catch(e){}
const $=s=>document.querySelector(s);
const ic=(id,s=20)=>`<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`;
const pill=(t,k='')=>`<span class="pill ${k}">${t}</span>`;
const sw=(on,label)=>`<label class="sw" onclick="event.stopPropagation()"><input type="checkbox" ${on?'checked':''} aria-label="${label}"><i></i></label>`;
const who=(ctl,title,sub)=>`<div class="who">${ctl}<span class="who-t"><b>${title}</b>${sub}</span></div>`;

function pageHead(title,desc){
  return `<div class="page-h"><h1>${title}</h1><button class="help" type="button" aria-label="Справка" onclick="openHelp()">${ic('i-help',20)}</button></div>
  ${desc?`<p class="page-d clamp" id="pd">${desc}</p><button class="more" type="button" onclick="const d=$('#pd');d.classList.toggle('clamp');this.textContent=d.classList.contains('clamp')?'Читать далее':'Свернуть'">Читать далее</button>`:''}`;
}
function blk(title,desc,body,side=''){
  return `<section class="blk"><div class="blk-h"><h2>${title}</h2>${side?`<div class="blk-side">${side}</div>`:''}</div>${desc?`<p class="blk-d">${desc}</p>`:''}${body}</section>`;
}
const table=(head,rows)=>`<div class="tw"><table class="t"><thead><tr>${head.map(h=>`<th scope="col"${h.r?' class="r"':''}>${h.t??h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;

/* ── экраны ── */
const V={};
V.main=()=>pageHead('Обзор','Состояние сервера и ноды loft. Карточки ведут в разделы.')+`
<div class="cards">
  <section class="card"><div class="card-h"><h2>Нода loft</h2>${pill('работает','ok')}</div>
    <dl class="kv"><div><dt>Роль</dt><dd>controller</dd></div><div><dt>Слушает</dt><dd class="mono">0.0.0.0:443 tcp</dd></div>
    <div><dt>Прочий трафик</dt><dd class="mono">→ nginx 127.0.0.1:8443</dd></div><div><dt>Фронты</dt><dd>get</dd></div>
    <div><dt>Сертификат</dt><dd>до 10.01.2027</dd></div><div><dt>Версия</dt><dd>1.0.22</dd></div></dl></section>
  <section class="card"><div class="card-h"><h2>Участники сети</h2><a href="#members" style="margin-left:auto">Все</a></div>
    <div style="display:flex;gap:32px;margin-bottom:16px"><div><div class="big num">${NETS.flatMap(n=>n.members).filter(m=>m.authorized).length}</div><div class="mute">включено</div></div><div><div class="big num">${Object.values(EXTRA).filter(x=>x[3]).length}</div><div class="mute">в сети</div></div><div><div class="big num">${NETS.flatMap(n=>n.members).filter(m=>!m.authorized).length}</div><div class="mute">выключено</div></div></div>
    <button class="btn pri" type="button" onclick="openMember('new')">${ic('i-plus')}Добавить участника</button></section>
  <section class="card"><div class="card-h"><h2>Интернет</h2><a href="#adapters" style="margin-left:auto">Подробно</a></div>
    <dl class="kv"><div><dt>Основной IP</dt><dd class="mono">203.0.113.10</dd></div><div><dt>Доп. IP</dt><dd class="mono">203.0.113.11</dd></div>
    <div><dt>IPv6</dt><dd class="mono">2001:db8::10</dd></div><div><dt>Канал «Нидерланды»</dt><dd class="mono">198.51.100.77</dd></div></dl></section>
  <section class="card"><div class="card-h"><h2>Домены</h2><a href="#domains" style="margin-left:auto">Все</a></div>
    <dl class="kv"><div><dt>vpn.example.net</dt><dd>${pill('серт до 10.01.2027','ok')}</dd></div><div><dt>panel.example.net</dt><dd>${pill('серт до 10.01.2027','ok')}</dd></div>
    <div><dt>nl.example.net</dt><dd>${pill('через 9 дн.','warn')}</dd></div><div><dt>DNS</dt><dd>Cloudflare</dd></div></dl></section>
  <section class="card"><div class="card-h"><h2>Сервер</h2><span class="mute" style="margin-left:auto">Debian 13 · amd64</span></div>
    <dl class="kv"><div><dt>CPU</dt><dd class="num">7%</dd></div><div><dt>Память</dt><dd class="num">0.6 / 2.0 ГБ</dd></div>
    <div><dt>Диск</dt><dd class="num">5.1 / 40 ГБ</dd></div><div><dt>Трафик за сутки</dt><dd class="num">↓ 18.4 ГБ · ↑ 2.1 ГБ</dd></div></dl></section>
  <section class="card"><div class="card-h"><h2>События</h2></div>
    <div class="ev"><time>12.10 11:42</time><span>admin выдал профиль <b>alice-phone</b></span></div>
    <div class="ev"><time>12.10 11:30</time><span>Выпущен сертификат vpn.example.net</span></div>
    <div class="ev"><time>12.10 11:28</time><span>Нода loft перезапущена: изменены фронты</span></div>
    <div class="ev"><time>12.10 11:05</time><span>Заблокирован 198.51.100.7: перебор паролей</span></div></section>
</div>`;

V.members=()=>{
 if(!NETS.length) return pageHead('Участники сети','Устройства и люди, которые подключаются к этому серверу. Каждому выдаётся свой ключ и профиль; протоколы включаются галочками. Участник сети — это порт свитча в <a href="#segments">Сегментах сети</a>.')+`<div class="empty"><b>Сеть не прочитана</b><p>Участники появятся, когда нода отдаст network.conf.</p></div>`;
 const all=NETS.flatMap(n=>portsOf(n).map(m=>[n,m]));
 return pageHead('Участники сети','Устройства и люди, которые подключаются к этому серверу. Каждому выдаётся свой ключ и профиль; протоколы включаются галочками. Участник сети — это порт свитча в <a href="#segments">Сегментах сети</a>.')+pendNet()+
 blk('Участники сети',`${all.filter(([,m])=>m.authorized).length} включено · сети ${NETS.map(n=>n.id).join(' и ')}`,
  `<div class="acts"><button class="btn pri" type="button" onclick="openMember('new')">${ic('i-plus')}Добавить участника</button></div>`+
  table(['Участник','Сеть · VLAN','IP в сети','Протоколы','Устройств','Последний вход'],all.map(([n,m])=>{const x=EXTRA[m.id]||['loft','0 / 1','—',0],v=n.vlans.find(y=>y.id===m.vlan);return `<tr class="click" onclick="openMember('${m.id}')">
   <td>${who(`<label class="sw" onclick="event.stopPropagation()"><input type="checkbox" ${m.authorized?'checked':''} aria-label="Включён" onchange="setMemberAuth('${m.id}',this.checked)"><i></i></label>`,esc(m.name),`<span class="sub mono">${esc(m.id)}</span>`)}</td>
   <td><span class="sq" style="background:${vcol(n,m.vlan)}"></span>${n.id}${v?' · '+v.id+' '+esc(v.name):''}</td><td class="mono">${m.ip||'—'}</td><td>${x[0]}</td><td class="num">${m.multi?x[1].split(' / ')[0]+' / '+(m.multi_limit||8):x[1].split(' / ')[0]+' / 1'}</td><td><span class="dot ${x[3]?'on':''}"></span>${x[2]}</td></tr>`}).join('')));
};
V.adapters=()=>pageHead('Адаптеры','Сетевые адаптеры сервера, их адреса и маршруты. Сети loft — в Сегментах, туннели — во Внешних каналах.')+pingCheckBox(S.pc||{kind:'auto',every:10,fails:5,probe:''},'up',true)+netAddr();
V.addrs=()=>V.adapters();
V.channels=()=>pageHead('Внешние каналы','VPN-каналы и прокси для выхода в интернет и приёма. SSTP и прокси встроены в loft, остальные — пакетами.')+netUp();
V.network=()=>V.channels();
const PC_MODES=[['off','Не использовать'],['ping','ICMP-запросы (Ping)'],['tls','TLS-проверка порта TCP'],['tcp','Проверка порта TCP'],['auto','Автоматический']];
function pingCheckBox(k,st,ping,own){
  k=k||{};if(own===undefined)own=true;
  const kind=k.kind||'off',probe=k.probe||'',every=k.every||10,fails=k.fails||5;
  const need=kind==='ping'||kind==='tcp'||kind==='tls';
  const pill=kind==='off'?'':st==='nolink'?`<span class="pill warn"><span class="dot"></span>НЕДОСТУПЕН</span>`:`<span class="pill ok"><span class="dot on"></span>ДОСТУПЕН</span>`;
  const modes=PC_MODES.filter(([v])=>v!=='ping'||ping).map(([v,l])=>`<option value="${v}" ${kind===v?'selected':''}>${l}</option>`).join('');
  const dis=own?'':'disabled';
  return blk('Проверка доступности интернета (Ping Check)','Нода проверяет, есть ли интернет через адаптер с маршрутом по умолчанию. Пока проверка не проходит, приоритеты пропускают «напрямую» и берут следующий канал.',
   (pill?`<div class="pc-st">${pill}</div>`:'')+
   `<div class="pc-flds">
     <div class="fld"><label for="pck">Режим</label><select id="pck" onchange="pcMode()" ${dis}>${modes}</select></div>
     <div id="pcf" class="pc-more" ${kind==='off'?'hidden':''}>
     <div class="fld"><label for="pcb">Периодичность проверки, сек</label><input id="pcb" class="num" value="${every}" oninput="pcTick()" ${dis}></div>
     <div class="fld"><label for="pcc">Порог срабатывания</label><input id="pcc" class="num" value="${fails}" oninput="pcTick()" ${dis}></div>
     <div id="pca-w" ${need?'':'hidden'}>
      <div class="fld" id="pca-f"><label for="pca">Проверять IP-адрес или домен</label><input id="pca" class="mono" value="${esc(probe)}" placeholder="1.1.1.1 или example.com" oninput="pcTick()" ${dis}></div>
      <div class="fld-err" id="pca-err" hidden>Заполните это поле</div>
      <div class="hint">Для TCP без порта берётся 80, для TLS — 443. Автоматический режим сам опрашивает ya.ru, nic.ru и google.com по HTTPS.</div>
     </div>
     </div>
     ${own?`<div class="pc-acts"><button class="btn pri" type="button" id="pcSave" disabled onclick="pcSave()">Сохранить</button><button class="btn" type="button" id="pcCancel" disabled onclick="pcCancel()">Отменить</button></div>`:''}
    </div>`);
}
function pcSaved(){return S.pc||{kind:'auto',every:10,fails:5,probe:''}}
function pcNow(){const e=$('#pck');if(!e)return pcSaved();return{kind:e.value,probe:($('#pca')&&$('#pca').value.trim())||'',every:parseInt($('#pcb').value,10)||0,fails:parseInt($('#pcc').value,10)||0}}
function pcDirty(){const a=pcNow(),b=pcSaved();return a.kind!==(b.kind||'off')||a.probe!==(b.probe||'')||a.every!==(b.every||10)||a.fails!==(b.fails||5)}
function pcValid(){const a=pcNow();if(a.kind==='ping'||a.kind==='tcp'||a.kind==='tls')return!!a.probe;return true}
function pcMode(){const n=pcNow().kind,need=n==='ping'||n==='tcp'||n==='tls';if($('#pcf'))$('#pcf').hidden=n==='off';if($('#pca-w'))$('#pca-w').hidden=!need;pcTick()}
function pcTick(){const bad=!pcValid();if($('#pca-f'))$('#pca-f').classList.toggle('bad',bad&&($('#pck').value==='ping'||$('#pck').value==='tcp'||$('#pck').value==='tls'));if($('#pca-err'))$('#pca-err').hidden=!bad||!($('#pck').value==='ping'||$('#pck').value==='tcp'||$('#pck').value==='tls');const d=pcDirty();if($('#pcSave'))$('#pcSave').disabled=!d||bad;if($('#pcCancel'))$('#pcCancel').disabled=!d}
function pcSave(){if(!pcValid()){pcTick();return}S.pc=pcNow();toast('Проверка сохранена — нода перечитала её');render()}
function pcCancel(){render()}
function netAddr(){
  const del=`<button class="icb del" type="button" aria-label="Удалить" onclick="toast('Применено — подтвердите в течение 2 минут');S.npend=1;render()">${ic('i-trash')}</button>`;

function pwEnhance(root){
 (root||document).querySelectorAll('.fld input[type=password]:not([data-pw-eye])').forEach(inp=>{
  inp.setAttribute('data-pw-eye','');
  const b=document.createElement('button');b.type='button';b.className='icb in-ic pw-eye';b.setAttribute('aria-label','Показать пароль');b.setAttribute('aria-pressed','false');b.innerHTML=ic('i-eye',20);

  inp.after(b);
  if(inp.dataset.pwMin||inp.dataset.pwSame)inp.addEventListener('input',()=>{inp.dataset.pwTouched='1';pwCheck(inp.closest('.dlg,.fs-card,.page')||document,false)});
 });
}
function pwHint(inp){const w=inp.closest('.fld').parentElement;let h=w.querySelector('[data-pw-hint]');if(!h){h=document.createElement('div');h.className='hint';h.setAttribute('data-pw-hint','');w.appendChild(h)}return h}
/* pwCheck показывает сообщения и возвращает true, если всё верно; all — проверить и нетронутые поля */
function pwCheck(root,all){
 let good=true;
 root.querySelectorAll('input[data-pw-min],input[data-pw-same]').forEach(inp=>{
  const v=inp.value,fld=inp.closest('.fld'),h=pwHint(inp),opt=inp.hasAttribute('data-pw-optional');
  let msg='',ok=true;
  if(inp.dataset.pwSame){const o=$('#'+inp.dataset.pwSame);if(v!==(o?o.value:'')){ok=false;msg=v?'Пароли не совпадают':'Повторите пароль'}else if(v)msg='Пароли совпадают'}
  else{const n=+inp.dataset.pwMin||PW_MIN,len=[...v].length;if(opt&&!len){msg=''}else if(len<n){ok=false;msg=len?`Ещё ${n-len} ${plural(n-len,'знак','знака','знаков')} — нужно не меньше ${n}`:`Не короче ${n} знаков`}else msg='Пароль отвечает требованиям'}
  const shown=all||inp.dataset.pwTouched;
  if(!ok)good=false;
  fld.classList.toggle('bad',!ok&&!!shown);
  h.textContent=shown||!ok?msg:h.textContent;
  h.classList.toggle('bad',!ok&&!!shown);h.classList.toggle('good',ok&&!!msg&&!!shown);
 });
 return good;
}

 while(i<m)out.push(['-',a[i++]]);while(j<n)out.push(['+',b[j++]]);return out.filter(x=>x[1]!==''||x[0]!==' ')}

const ip2n=s=>s.split('.').reduce((a,x)=>a*256+ +x,0),n2ip=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255].join('.');

function firstHost(c){const R=cidrRange(c);return R?n2ip(R[0]+1):''}
function suggestVlanCIDR(n,vid){

 const busy=(lo,hi)=>taken.some(([a,b])=>lo<=b&&hi>=a);
 const tryC=c=>{const R=cidrRange(c);return R&&!busy(R[0],R[1])?c:''};
 const hit=tryC('10.'+vid+'.0.0/24')||tryC('192.168.'+(vid%256)+'.0/24')||tryC('172.16.'+(vid%256)+'.0/24');
 if(hit)return hit;

}

 const segs=[{id:0,name:n.name||n.id,cidr:n.cidr}].concat((n.vlans||[]).map(z=>({id:z.id,name:z.name||('VLAN '+z.id),cidr:z.cidr})));
 for(const s of segs){
  if(s.id===skip||!s.cidr)continue;
  const r=cidrRange(s.cidr);

 const v=(n.vlans||[]).find(x=>x.id===vid);

/* ── итог доступа VLAN → VLAN: правила сверху вниз, затем режим сети ── */
function access(n,s,d){
 const sc=s?((n.vlans.find(v=>v.id===s)||{}).cidr||n.cidr):n.cidr,dc=d?((n.vlans.find(v=>v.id===d)||{}).cidr||n.cidr):n.cidr;
 const inV=A=>n.vlans.some(v=>{const R=cidrRange(v.cidr);return R&&A[0]>=R[0]&&A[1]<=R[1]});
 const cover=(addr,c,z)=>{if(!addr)return 2;const A=cidrRange(addr.includes('/')?addr:addr+'/32'),C=cidrRange(c);if(!A||!C)return 0;if(z&&inV(A))return 0;if(A[0]<=C[0]&&A[1]>=C[1])return 2;if(A[1]<C[0]||A[0]>C[1])return 0;return 1};

 for(let i=0;i<n.rules.length;i++){const r=n.rules[i];
  if(r.src_vlan!=null&&r.src_vlan!==s)continue;if(r.dst_vlan!=null&&r.dst_vlan!==d)continue;
  const a=cover(r.src,sc,!s),b=cover(r.dst,dc,!d);if(!a||!b)continue;

function joinSeg(mid,vlan){const n=curNet(),m=n.members.find(x=>x.id===mid);if(!m||(m.vlan||0)===vlan)return;moveVlan(n,m,vlan);render()}
function segTabs(n,id){
 return `<div class="tabs" role="tablist" aria-label="Сегменты">${segsOf(n).map(s=>`<button class="tab ${s.id===id?'on':''}" role="tab" aria-selected="${s.id===id}" type="button" onclick="go('segments/${s.id}')">${esc(s.name)}</button>`).join('')}<button class="tab plus" type="button" aria-label="Добавить сегмент" title="Добавить сегмент" onclick="addSeg()">${ic('i-plus')}</button></div>`;
}
function renameSeg(id,name){
 const n=curNet();
 name=String(name||'').trim();
 if(!name){render();return}
 if(!id)n.name=name;
 else{const v=n.vlans.find(x=>x.id===id);if(v)v.name=name}
 render();
}
function addSeg(){
 const n=curNet();
 const used=new Set((n.vlans||[]).map(v=>v.id));
 const id=[10,20,30,40,50,60,70,80,90].find(x=>!used.has(x))||((n.vlans||[]).reduce((m,v)=>Math.max(m,v.id),0)+10);
 const cidr=suggestVlanCIDR(n,id),gw=firstHost(cidr),R=cidrRange(cidr);
 const v=vlanObj(id);
 v.cidr=cidr;v.gateway=gw;
 if(R){v.pool_from=n2ip(R[0]+10);v.pool_to=n2ip(Math.min(R[0]+200,R[1]-1))}
 n.vlans.push(v);n.vlans.sort((a,b)=>a.id-b.id);
 go('segments/'+id);
}
function saveSeg(id){
 const n=curNet(),g=i=>$('#'+i).value.trim();
 let name=g('sgName'),cidr=g('sgCidr'),gw=g('sgGw'),from=g('sgFrom'),to=g('sgTo'),peers=g('sgPeers');
 const dnsOn=g('sgDns')!=='0';
 if(!id&&!cidr){toast('Диапазон');return}
 {const err=vlanCIDRErr(cidr,n,id);if(err){toast(err);return}}
 if(cidr&&!gw)gw=firstHost(cidr);
 if(cidr&&gw&&!inRange(gw,cidr)){toast('Шлюз вне диапазона');return}
 if((from&&!to)||(!from&&to)){toast('Пул: укажите оба конца или оставьте пустым');return}
 if(!id){
  n.name=name||n.name;n.cidr=cidr;n.gateway=gw;n.pool_from=from;n.pool_to=to;n.peers=peers||n.peers||'hub';
  n.dns.enabled=dnsOn?null:false;
 }else{
  let v=n.vlans.find(x=>x.id===id);if(!v)return;
  const raw=g('sgVid'),nid=+raw;
  if(!/^[1-9]\d{0,3}$/.test(raw)||nid>4094){toast('VLAN ID — число 1–4094');return}
  if(n.vlans.some(x=>x.id===nid&&x!==v)){toast('Такой VLAN ID уже есть');return}
  if(!v.dns)v.dns={enabled:null,servers:[],upstream:[]};
  Object.assign(v,{name,cidr,gateway:gw,pool_from:from,pool_to:to,peers});
  v.dns.enabled=dnsOn?null:false;
  if(nid!==id){
   n.members.forEach(m=>{if((m.vlan||0)===id)m.vlan=nid});
   n.rules.forEach(r=>{if(r.src_vlan===id)r.src_vlan=nid;if(r.dst_vlan===id)r.dst_vlan=nid});
   v.id=nid;n.vlans.sort((a,b)=>a.id-b.id);id=nid;
  }
 }
 n.members.forEach(m=>{if((m.vlan||0)===id&&m.ip&&cidr&&!inRange(m.ip,cidr))m.ip=nextIP(n,id)});
 toast('Сохранено');
 if(id&&String(S.arg)!==String(id)){S.arg=String(id);go('segments/'+id);return}
 render();
}

   `<div class="fgrid">${isoFld}<div class="acts" style="grid-column:1/-1;margin:0"><button class="btn pri" type="submit">Сохранить</button></div></div>`,
   peers==='hub'?pill('абоненты изолированы','ok'):''):'')+
  blk('Параметры IP','Укажите параметры IP этого сегмента.',
  `<div class="fgrid">
   <div style="grid-column:1/-1">${vlanIdRow(id)}</div>
   <div class="fld"><label for="sgName">Имя сегмента</label><input id="sgName" value="${esc(s.name)}"></div>
   <div><div class="fld"><label for="sgCidr">Диапазон</label><input id="sgCidr" class="mono" value="${esc(cidr)}"></div><div class="hint">${id?'Свой диапазон, не пересекается с другими сегментами. Пусто — как в основном сегменте.':cidrHosts(cidr)}</div></div>

   <div class="fld"><label for="sgFrom">Пул адресов, с</label><input id="sgFrom" class="mono" value="${esc(from)}" placeholder="авто"></div>
   <div class="fld"><label for="sgTo">Пул адресов, по</label><input id="sgTo" class="mono" value="${esc(to)}" placeholder="авто"></div>
   <div class="fld"><label for="sgDns">DNS для участников</label><select id="sgDns"><option value="1" ${dns.enabled!==false?'selected':''}>на адресе шлюза</option><option value="0" ${dns.enabled===false?'selected':''}>не давать</option></select></div>
   ${id?'':isoFld}
   <div class="acts" style="grid-column:1/-1;margin:0"><button class="btn pri" type="submit">Сохранить</button><button class="btn" type="button" onclick="render()">Отменить</button>${id?`<button class="btn danger" type="button" style="margin-left:auto" onclick="delVlan(${id})">Удалить сегмент</button>`:''}</div>
  </div>`)+

}

function saveNet(){
 const n=curNet(),g=id=>$('#'+id).value.trim(),old=n.id;
 n.id=g('s2')||old;n.mtu=+g('s8')||1280;
 n.p2p=g('s9')===''?null:g('s9')==='1';n.dns.upstream=g('s11')?g('s11').split(/\s+/):[];n.enabled=$('#s12').checked;

 if(old!==n.id){APPLIED[n.id]=APPLIED[old];delete APPLIED[old];S.net=n.id}
 delete CFG[n.id];toast('Сохранено');render();
}

function userMenu(v){const m=$('#umenu'),on=v===undefined?m.hidden:v;m.hidden=!on;$('#userBtn').setAttribute('aria-expanded',on)}
document.addEventListener('click',e=>{if(!e.target.closest('#userBtn,#umenu'))userMenu(false);if(!e.target.closest('.pj,.pj-menu'))closeJoin()});
function goOut(){go('login')}
const RIGHT=['нет','смотрит','меняет'];
/* #me: the signed-in user's own sign-in */
V.me=()=>pageHead('Личный кабинет','Ваш вход в панель: права роли, пароль, API-токен и сессии.')+
 blk('Профиль','',`<dl class="kv"><div><dt>Логин</dt><dd class="mono">admin</dd></div><div><dt>Роль</dt><dd>Владелец</dd></div><div><dt>Последний вход</dt><dd>сейчас</dd></div></dl>
  <details class="adv" style="margin-top:12px"><summary>Права роли</summary>${table(['Раздел','Доступ'],MENU.flatMap(g=>g.items).map(([k,t])=>`<tr><td>${t}</td><td>${RIGHT[2]}</td></tr>`).join(''))}</details>`)+
 blk('Пароль','После смены остальные ваши сессии завершатся.',`<button class="btn" type="button" onclick="openMyPw()">Сменить пароль</button>`)+
 blk('API-токен','Для скриптов и интеграций: заголовок Authorization: Bearer …. Права — как у вашей роли.',`<div class="uri" style="margin-bottom:16px">lpt_…a91c · выпущен 12.10.2026 · последний раз 2 ч назад</div><div class="acts"><button class="btn" type="button" onclick="toast('Токен выпущен')">Перевыпустить</button><button class="btn danger" type="button" onclick="toast('Токен отозван')">Отозвать</button></div>`)+
 blk('Сессии','Где вы сейчас вошли в панель.',`<div class="acts"><button class="btn" type="button" onclick="toast('Остальные сессии завершены')">Завершить остальные</button><button class="btn" type="button" onclick="goOut()">${ic('i-out',18)}Выйти</button></div>`+
  table(['Устройство','IP','Вход','Активность',{t:'',r:1}],[['Chrome · macOS','198.51.100.20','12.10 09:14','сейчас',1],['Safari · iPhone','198.51.100.31','11.10 21:02','3 ч назад',0]].map(r=>`<tr><td>${r[0]}${r[4]?' <span class="mute">(это устройство)</span>':''}</td><td class="mono">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="r">${r[4]?'':`<button class="btn sm" type="button" onclick="toast('Сессия завершена')">Завершить</button>`}</td></tr>`).join('')));
function openMyPw(){dialog('Сменить пароль','Остальные ваши сессии завершатся.',`
  <div class="fld"><label for="me1">Текущий пароль</label><input id="me1" type="password" autocomplete="current-password"></div>
  <div><div class="fld"><label for="me2">Новый пароль</label><input id="me2" type="password" autocomplete="new-password" data-pw-min="9"></div><div class="hint" data-pw-hint>Не короче 9 знаков.</div></div>`,
  `<button class="btn pri" type="button" onclick="if(pwCheck($('#dlgRoot'),true)){closeDlg();toast('Пароль изменён')}else toast('Проверьте пароль')">Сменить</button><button class="btn" type="button" onclick="closeDlg()">Отмена</button>`)}
V.about=()=>pageHead('О loft panel','')+`<div class="card"><div class="about">
  <p>loft panel ведёт сервер loft: ставит и запускает ноду и нужные пакеты, держит сеть loft и её участников, внешние каналы и правила выхода, домены, сертификаты и почту, пользователей панели и резервные копии.</p>
  <h3>Разработчик</h3>
  <p translate="no">A<sup>3</sup> solutions.</p>
  <h3>Компоненты</h3>
  <p class="mute" style="margin-bottom:12px">Спасибо открытым проектам, на которых построен продукт:</p>
  <div class="about-grid">${OSS.map(([n,r])=>`<div class="about-oss"><b>${n}</b><span>${r}</span></div>`).join('')}</div>
  <p class="mute" style="margin:16px 0 0">Версия ${S.ver||'dev'}</p>
</div></div>`;
function render(){
  closeJoin();
  const f=!!FULL[S.route];$('#app').hidden=f;$('#full').hidden=!f;
  if(f){renderFull();document.title=(S.route==='login'?'Вход':'Мастер установки')+' · loft-panel';return}
  renderMenu();
  $('#page').innerHTML=(V[S.route]||V.main)();
  renderFoot();
  const pd=$('#pd'),mb=$('.more');if(pd&&mb)mb.classList.toggle('need',pd.scrollHeight>pd.clientHeight+1);
  const title=MENU.flatMap(g=>g.items).find(i=>i[0]===S.route);
  document.title=(title?title[1]+' · ':S.route==='about'?'О loft panel · ':S.route==='me'?'Личный кабинет · ':'')+'loft-panel';
  pwEnhance($('#page'));
}
function go(r){location.hash=r}
function setOpen(v){S.open=v;$('#app').classList.toggle('menu-open',v);$('#menuBtn').setAttribute('aria-expanded',v);$('#menuBtn').setAttribute('aria-label',v?'Закрыть меню':'Открыть меню');$('#menuBtn').innerHTML=ic(v?'i-x':'i-menu',24)}
function setRoute(){
 const [r,...a]=location.hash.slice(1).split('/');
 S.route=r||'main';S.arg=decodeURIComponent(a.join('/'));
 if(S.route==='network'){S.route=S.arg==='addr'?'adapters':'channels';try{history.replaceState(null,'','#'+S.route)}catch(e){}}
 if(S.route==='addrs'){S.route='adapters';try{history.replaceState(null,'','#adapters')}catch(e){}}
 if(S.route==='prio'){S.route='iface-priorities';try{history.replaceState(null,'','#'+(S.arg==='use'?'iface-priorities/use':'iface-priorities'))}catch(e){}}
 if(S.route==='iface-priorities')S.tab.prio=S.arg==='use'?'use':'lists';
}
window.addEventListener('hashchange',()=>{setRoute();setOpen(false);closeDlg();closeHelp();render();const f=S.after;S.after=null;if(f)f();$('#main').scrollTop=0});
$('#menuBtn').onclick=()=>setOpen(!S.open);
$('#foldBtn').onclick=()=>{S.rail=!S.rail;try{localStorage.setItem('lp-rail',S.rail?'1':'0')}catch(e){}renderMenu()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeJoin();userMenu(false);if($('#helpD')){closeHelp();return}if($('#dlgRoot').innerHTML)closeDlg();else if(S.open)setOpen(false)}});
setRoute();
render();
</script>
