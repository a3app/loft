name: Dist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Match tag to VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(tr -d ' \n' < VERSION)
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $ver" >&2
            exit 1
          fi

  # Module proxy and pkg.go.dev lag the git tag. Dist asks both so
  # https://pkg.go.dev/github.com/a3app/loft follows the release.
  # 408 from POST /fetch/… is pkgsite still building, not an error.
  go-index:
    name: pkg.go.dev
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch module into proxy.golang.org
        env:
          MOD: github.com/${{ github.repository }}
        run: |
          set -eu
          ver=$GITHUB_REF_NAME
          proxy="https://proxy.golang.org/${MOD}/@v/${ver}"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS -o /tmp/mod.info "$proxy.info"; then
              ok=1
              break
            fi
            echo "proxy miss ${i}, retry" >&2
            sleep 15
          done
          [ "$ok" = 1 ]
          cat /tmp/mod.info
          curl -fsS -o /tmp/mod.mod "$proxy.mod"
          curl -fsS -o /dev/null "$proxy.zip"
          curl -fsS "https://sum.golang.org/lookup/${MOD}@${ver}"

      - name: Request pkg.go.dev docs
        env:
          MOD: github.com/${{ github.repository }}
        run: |
          set -eu
          ver=$GITHUB_REF_NAME
          url="https://pkg.go.dev/fetch/${MOD}@${ver}"
          code=$(curl -sS -o /tmp/pkg-fetch.txt -w '%{http_code}' -X POST -A 'loft-dist' "$url" || true)
          cat /tmp/pkg-fetch.txt || true
          echo "pkg.go.dev fetch HTTP ${code}"
          case "$code" in
            200|408) ;;
            *) echo "pkg.go.dev fetch returned ${code} (non-fatal)" >&2 ;;
          esac
          curl -sS -o /dev/null -w "pkg.go.dev page %{http_code}\n" \
            -A 'loft-dist' "https://pkg.go.dev/${MOD}@${ver}" || true

  linux:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Node packages, panel and CLI archives
        run: make dist-node dist-panel dist-clients
      - name: Unique checksum names
        run: |
          ver=$(tr -d ' \n' < VERSION)
          cp dist/node/SHA256SUMS "dist/node/loft-node-${ver}-SHA256SUMS.txt"
          cp dist/clients/go/SHA256SUMS "dist/clients/go/loft-clients-${ver}-SHA256SUMS.txt"
          cp dist/panel/SHA256SUMS "dist/panel/loft-panel-${ver}-SHA256SUMS.txt"
      - name: Smoke archives
        run: |
          set -eu
          find dist/node dist/panel dist/clients/go -name '*.tar.gz' | sort | while IFS= read -r f; do
            tar -tzf "$f" >/dev/null
            echo "$f"
          done
          find dist/node dist/panel -name '*.deb' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/node/**/*.tar.gz
            dist/node/**/*.deb
            dist/node/loft-node-*-SHA256SUMS.txt
            dist/panel/**/*.tar.gz
            dist/panel/**/*.deb
            dist/panel/loft-panel-*-SHA256SUMS.txt
            dist/clients/go/*.tar.gz
            dist/clients/go/loft-clients-*-SHA256SUMS.txt

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: macOS DMGs arm64 + x86_64 (ad-hoc, no VERSION bump)
        run: make macos-dmgs BUMP=0
      - name: Smoke DMGs
        run: |
          set -eu
          ver=$(tr -d ' \n' < clients/macOS/VERSION)
          test -f "dist/clients/macOS/loft-${ver}-macos-arm64.dmg"
          test -f "dist/clients/macOS/loft-${ver}-macos-x86_64.dmg"
          ls -l dist/clients/macOS/*.dmg
      - name: Drop scratch images
        run: rm -f dist/clients/macOS/*.rw.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          retention-days: 14
          path: dist/clients/macOS/*.dmg

  android:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # v3 runs `sdkmanager tools`; Google no longer serves that package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: NDK
        run: |
          set -eu
          sdkmanager --install "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: GitHub signing key
        env:
          LOFT_ANDROID_KEYSTORE: ${{ secrets.LOFT_ANDROID_KEYSTORE }}
          LOFT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LOFT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${LOFT_ANDROID_KEYSTORE}" ] || [ -z "${LOFT_ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            echo "no LOFT_ANDROID_KEYSTORE secret; skip APK" >&2
            exit 0
          fi
          mkdir -p secrets
          echo "${LOFT_ANDROID_KEYSTORE}" | base64 -d > secrets/android-github.p12
          printf '%s' "${LOFT_ANDROID_KEYSTORE_PASSWORD}" > secrets/android-github.pass
          chmod 600 secrets/android-github.p12 secrets/android-github.pass
      - name: GitHub-channel APKs
        if: env.skip != '1'
        run: make -C clients/Android release
      - name: Smoke APKs
        if: env.skip != '1'
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          test -f "dist/clients/Android/loft-${ver}-android.apk"
          test -f "dist/clients/Android/loft-${ver}-android-tv.apk"
          test -f "dist/clients/Android/loft-android-${ver}-SHA256SUMS.txt"
          unzip -t "dist/clients/Android/loft-${ver}-android.apk" >/dev/null
          unzip -t "dist/clients/Android/loft-${ver}-android-tv.apk" >/dev/null
      - uses: actions/upload-artifact@v4
        if: env.skip != '1'
        with:
          name: android
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/clients/Android/loft-*-android.apk
            dist/clients/Android/loft-*-android-tv.apk
            dist/clients/Android/loft-android-*-SHA256SUMS.txt

  release:
    needs: [linux, macos, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stable names for /releases/latest/download
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          mkdir -p artifacts/latest
          find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' -o -name '*SHA256SUMS.txt' \
          \) | sort | while IFS= read -r f; do
            base=$(basename "$f")
            stable=$(printf '%s' "$base" | sed -e "s/-${ver}-/-/g" -e "s/_${ver}_/_/g")
            if [ "$stable" != "$base" ]; then
              cp "$f" "artifacts/latest/$stable"
            fi
          done
          for need in \
            loft-macos-arm64.dmg loft-macos-x86_64.dmg \
            loft-darwin-arm64.tar.gz loft-darwin-amd64.tar.gz \
            loft-linux-arm64.tar.gz loft-linux-amd64.tar.gz \
            loft-node-linux-arm64.tar.gz loft-node-linux-amd64.tar.gz \
            loft-node_arm64.deb loft-node_amd64.deb \
            loft-panel-linux-arm64.tar.gz loft-panel-linux-amd64.tar.gz \
            loft-panel_arm64.deb loft-panel_amd64.deb \
            loft-clients-SHA256SUMS.txt loft-node-SHA256SUMS.txt loft-panel-SHA256SUMS.txt
          do
            test -f "artifacts/latest/$need"
          done
          if find artifacts -name 'loft-*-android.apk' | grep -q .; then
            for need in loft-android.apk loft-android-tv.apk loft-android-SHA256SUMS.txt; do
              test -f "artifacts/latest/$need"
            done
          fi
          ls -l artifacts/latest
      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mapfile -t files < <(find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' -o -name '*SHA256SUMS.txt' \
          \) | sort)
          [ "${#files[@]}" -gt 0 ]
          ver=$(tr -d ' \n' < VERSION)
          notes=GH_RELEASE.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "loft $ver" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --title "loft $ver" --notes-file "$notes" "${files[@]}"
            else
              gh release create "$GITHUB_REF_NAME" --title "loft $ver" --generate-notes "${files[@]}"
            fi
          fi
