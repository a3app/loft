name: Dist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Match tag to VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(tr -d ' \n' < VERSION)
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $ver" >&2
            exit 1
          fi

  # Module proxy and pkg.go.dev lag the git tag. Dist asks both so
  # https://pkg.go.dev/github.com/a3app/loft follows the release.
  # 408 from POST /fetch/… is pkgsite still building, not an error.
  go-index:
    name: pkg.go.dev
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch module into proxy.golang.org
        env:
          MOD: github.com/${{ github.repository }}
        run: |
          set -eu
          ver=$GITHUB_REF_NAME
          proxy="https://proxy.golang.org/${MOD}/@v/${ver}"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS -o /tmp/mod.info "$proxy.info"; then
              ok=1
              break
            fi
            echo "proxy miss ${i}, retry" >&2
            sleep 15
          done
          [ "$ok" = 1 ]
          cat /tmp/mod.info
          curl -fsS -o /tmp/mod.mod "$proxy.mod"
          curl -fsS -o /dev/null "$proxy.zip"
          curl -fsS "https://sum.golang.org/lookup/${MOD}@${ver}"

      - name: Request pkg.go.dev docs
        env:
          MOD: github.com/${{ github.repository }}
        run: |
          set -eu
          ver=$GITHUB_REF_NAME
          url="https://pkg.go.dev/fetch/${MOD}@${ver}"
          code=$(curl -sS -o /tmp/pkg-fetch.txt -w '%{http_code}' -X POST -A 'loft-dist' "$url" || true)
          cat /tmp/pkg-fetch.txt || true
          echo "pkg.go.dev fetch HTTP ${code}"
          case "$code" in
            200|408) ;;
            *) echo "pkg.go.dev fetch returned ${code} (non-fatal)" >&2 ;;
          esac
          curl -sS -o /dev/null -w "pkg.go.dev page %{http_code}\n" \
            -A 'loft-dist' "https://pkg.go.dev/${MOD}@${ver}" || true

  linux:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Node packages, panel and CLI archives
        run: make dist-node dist-panel dist-clients
      - name: Unique checksum names
        run: |
          ver=$(tr -d ' \n' < VERSION)
          cp dist/node/SHA256SUMS "dist/node/loft-node-${ver}-SHA256SUMS.txt"
          cp dist/clients/go/SHA256SUMS "dist/clients/go/loft-clients-${ver}-SHA256SUMS.txt"
          cp dist/panel/SHA256SUMS "dist/panel/loft-panel-${ver}-SHA256SUMS.txt"
      - name: Smoke archives
        run: |
          set -eu
          find dist/node dist/panel dist/clients/go -name '*.tar.gz' | sort | while IFS= read -r f; do
            tar -tzf "$f" >/dev/null
            echo "$f"
          done
          find dist/node dist/panel -name '*.deb' | sort
      - name: Smoke checksums
        # The release page lists assets flat, so check each SHA256SUMS the
        # way a user would: files copied into one folder, then sha256sum -c.
        run: |
          set -eu
          for d in dist/node dist/panel dist/clients/go; do
            flat=$(mktemp -d)
            find "$d" -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} "$flat"/ \;
            (cd "$flat" && sha256sum -c "$GITHUB_WORKSPACE/$d/SHA256SUMS")
            rm -rf "$flat"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/node/**/*.tar.gz
            dist/node/**/*.deb
            dist/node/loft-node-*-SHA256SUMS.txt
            dist/panel/**/*.tar.gz
            dist/panel/**/*.deb
            dist/panel/loft-panel-*-SHA256SUMS.txt
            dist/clients/go/*.tar.gz
            dist/clients/go/loft-clients-*-SHA256SUMS.txt

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: macOS DMGs arm64 + amd64 (ad-hoc, no VERSION bump)
        run: make macos-dmgs BUMP=0
      - name: Smoke DMGs
        run: |
          set -eu
          ver=$(tr -d ' \n' < clients/macOS/VERSION)
          test -f "dist/clients/macOS/loft-macos-${ver}-arm64.dmg"
          test -f "dist/clients/macOS/loft-macos-${ver}-amd64.dmg"
          ls -l dist/clients/macOS/*.dmg
      - name: Drop scratch images
        run: rm -f dist/clients/macOS/*.rw.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          retention-days: 14
          path: dist/clients/macOS/*.dmg

  android:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"
      # v3 runs `sdkmanager tools`; Google no longer serves that package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: NDK
        run: |
          set -eu
          sdkmanager --install "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: GitHub signing key
        env:
          LOFT_ANDROID_KEYSTORE: ${{ secrets.LOFT_ANDROID_KEYSTORE }}
          LOFT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LOFT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${LOFT_ANDROID_KEYSTORE}" ] || [ -z "${LOFT_ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            echo "no LOFT_ANDROID_KEYSTORE secret; skip APK" >&2
            exit 0
          fi
          mkdir -p secrets
          echo "${LOFT_ANDROID_KEYSTORE}" | base64 -d > secrets/android-github.p12
          printf '%s' "${LOFT_ANDROID_KEYSTORE_PASSWORD}" > secrets/android-github.pass
          chmod 600 secrets/android-github.p12 secrets/android-github.pass
      - name: GitHub-channel APKs
        if: env.skip != '1'
        env:
          # issues:write on a3app/loft only; baked into the APK. Empty: reports queue.
          LOFT_ANDROID_CRASH_TOKEN: ${{ secrets.LOFT_ANDROID_CRASH_TOKEN }}
        run: make -C clients/Android release
      - name: Smoke APKs
        if: env.skip != '1'
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          test -f "dist/clients/Android/loft-android-${ver}.apk"
          test -f "dist/clients/Android/loft-androidtv-${ver}.apk"
          test -f "dist/clients/Android/loft-android-${ver}-SHA256SUMS.txt"
          unzip -t "dist/clients/Android/loft-android-${ver}.apk" >/dev/null
          unzip -t "dist/clients/Android/loft-androidtv-${ver}.apk" >/dev/null
      - uses: actions/upload-artifact@v7
        if: env.skip != '1'
        with:
          name: android
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/clients/Android/loft-android-*.apk
            dist/clients/Android/loft-androidtv-*.apk
            dist/clients/Android/loft-android-*-SHA256SUMS.txt

  windows:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 zip unzip
      - name: llvm-mingw (Windows ARM64)
        run: |
          set -eu
          ver=20261020
          tar=llvm-mingw-${ver}-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${ver}/${tar}"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          sudo tar -C /opt -xJf /tmp/llvm-mingw.tar.xz
          echo "LLVM_MINGW=/opt/llvm-mingw-${ver}-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
      - name: Wintun 0.14.1
        run: make -C clients/Windows/wintun-check dist/x64/wintun.dll dist/x86/wintun.dll dist/arm64/wintun.dll
      - name: loft-front Windows ARM64
        run: make -C clients/Windows front-arm64 LLVM_MINGW="${LLVM_MINGW}"
      # Pinned XTLS/go-win7. Official Go 1.21+ cannot target Windows 7.
      # The zip is the SDK itself (bin/, src/, pkg/) or a top-level go/ directory.
      # ARM64 front already built: this overwrites GOROOT.
      - name: Patched Go for Windows 7
        run: |
          set -eu
          sdk=$(go env GOROOT)
          curl -fsSL -L -o /tmp/go-win7.zip \
            https://github.com/XTLS/go-win7/releases/download/patched-1.27.2/go-for-win7-linux-amd64.zip
          rm -rf "${sdk:?}/"*
          unzip -q /tmp/go-win7.zip -d "$sdk"
          if [ -x "$sdk/go/bin/go" ] && [ ! -x "$sdk/bin/go" ]; then
            mv "$sdk/go/"* "$sdk/"
            rmdir "$sdk/go" || true
          fi
          GOTOOLCHAIN=local "$sdk/bin/go" version
          echo "LOFT_GOROOT=$sdk" >> "$GITHUB_ENV"
      - name: loft-front Win7
        run: |
          set -eu
          test -x "${LOFT_GOROOT}/bin/go"
          make -C clients/Windows front GO_WIN7="${LOFT_GOROOT}/bin/go" GOROOT="${LOFT_GOROOT}"
      - name: Portable zips
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          make -C clients/Windows portable VER="$ver" LLVM_MINGW="${LLVM_MINGW}"
      - name: Smoke
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          sums="dist/clients/Windows/github/loft-windows-${ver}-SHA256SUMS.txt"
          test -f "$sums"
          (cd dist/clients/Windows/github && sha256sum -c "loft-windows-${ver}-SHA256SUMS.txt")
          for a in amd64 386 arm64; do
            z="dist/clients/Windows/github/loft-windows-${ver}-${a}.zip"
            test -f "$z"
            unzip -t "$z" >/dev/null
            unzip -l "$z" | grep -q 'loft.exe'
            unzip -l "$z" | grep -q 'loft-svc.exe'
            unzip -l "$z" | grep -q 'wintun.dll'
            unzip -l "$z" | grep -q 'loft-front.exe'
          done
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/clients/Windows/github/loft-windows-*.zip
            dist/clients/Windows/github/loft-windows-*-SHA256SUMS.txt

  # MikroTik RouterOS container (clients/MikroTik). Two outputs:
  #   - docker-save tarballs for amd64, arm64 and armv7 plus SHA256SUMS, for
  #     the Release: the operator uploads one to the router by hand;
  #   - on a tag, one multi-arch image ghcr.io/a3app/loft-mikrotik:<ver>
  #     and :latest, which RouterOS can pull itself.
  # No QEMU: the Dockerfile runs nothing for the target architecture.
  mikrotik:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The default "docker" builder cannot export several platforms in one
      # image; a docker-container builder can.
      - name: Buildx builder
        run: docker buildx create --use --name loft --driver docker-container
      - name: Image tarballs
        run: make -C clients/MikroTik dist
      - name: Smoke tarballs
        # Each tarball must hold exactly one plain image manifest (RouterOS
        # cannot read an index of indexes) of the right architecture, and
        # SHA256SUMS must check out from a flat folder like a user's.
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          cd dist/mikrotik
          for a in amd64:amd64 arm64:arm64 armv7:arm; do
            f="loft-mikrotik-${ver}-${a%%:*}.tar"
            d=$(mktemp -d)
            tar -xf "$f" -C "$d"
            python3 - "$d" "${a#*:}" <<'PY'
          import json, sys
          d, want = sys.argv[1], sys.argv[2]
          idx = json.load(open(d + "/index.json"))["manifests"]
          assert len(idx) == 1 and idx[0]["mediaType"].endswith("manifest.v1+json"), idx
          m = json.load(open(d + "/manifest.json"))[0]
          arch = json.load(open(d + "/" + m["Config"]))["architecture"]
          assert arch == want, (arch, want)
          print(d, arch, "ok")
          PY
            rm -rf "$d"
          done
          sha256sum -c "loft-mikrotik-${ver}-SHA256SUMS.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: mikrotik
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/mikrotik/loft-mikrotik-*.tar
            dist/mikrotik/loft-mikrotik-*-SHA256SUMS.txt
      - name: Push ghcr.io/a3app/loft-mikrotik
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          make -C clients/MikroTik push

  # KeeneticOS Entware (clients/NDMS). Three ipk, a .sha256 sidecar for
  # each (the panel matches the ipk name plus ".sha256"), and one
  # SHA256SUMS. An ipk is an ar of debian-binary, control.tar.gz and
  # data.tar.gz, not a tar.
  ndms:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Entware packages
        run: make -C clients/NDMS dist
      - name: Smoke ipk
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          cd dist/ndms
          python3 - "$ver" <<'PY'
          import glob, io, struct, subprocess, sys, tarfile
          ver = sys.argv[1]
          want = {
              "aarch64": (2, 183, "aarch64-3.10"),  # ELFCLASS64, EM_AARCH64
              "armv7": (1, 40, "armv7-3.2"),        # ELFCLASS32, EM_ARM
              "mipsel": (1, 8, "mipsel-3.4"),       # ELFCLASS32, EM_MIPS
          }
          # Go does not set EF_ARM_ABI_FLOAT_SOFT. Reject the hard-float
          # bit, and require the buildinfo line the Makefile asks for.
          FLOAT_HARD = 0x400
          buildinfo = {
              "aarch64": b"\nbuild\tGOARCH=arm64\n",
              "armv7": b"\nbuild\tGOARM=7,softfloat\n",
              "mipsel": b"\nbuild\tGOMIPS=softfloat\n",
          }

          def ar_members(path):
              # Size is the body only. An odd member's pad newline sits
              # after that length and is not a second archive member.
              data = open(path, "rb").read()
              if not data.startswith(b"!<arch>\n"):
                  raise SystemExit(path + " is not an ar")
              off, out = 8, {}
              while off + 60 <= len(data):
                  hdr = data[off:off + 60]
                  name = hdr[:16].split(b"\x00", 1)[0].decode().strip().rstrip("/")
                  size = int(hdr[48:58])
                  body = data[off + 60:off + 60 + size]
                  if len(body) != size or not name:
                      raise SystemExit(f"{path} bad member {name!r} at {off}")
                  out[name] = body
                  off += 60 + size + (size & 1)
              if off != len(data):
                  raise SystemExit(f"{path} trailing {len(data) - off} bytes")
              return out

          for name, (cls, mach, ent) in want.items():
              f = f"loft-ndms-{ver}-{name}.ipk"
              members = ar_members(f)
              for need in ("debian-binary", "control.tar.gz", "data.tar.gz"):
                  if need not in members:
                      raise SystemExit(f"{f} missing {need}: {sorted(members)}")
              if members["debian-binary"] != b"2.0\n":
                  raise SystemExit(f"{f} debian-binary {members['debian-binary']!r}")
              ctrl = tarfile.open(fileobj=io.BytesIO(members["control.tar.gz"]), mode="r:gz")
              text = ctrl.extractfile("control").read().decode()
              for line in (f"Package: loft", f"Architecture: {ent}", f"Version: {ver}"):
                  if line not in text.splitlines():
                      raise SystemExit(f"{f} control missing {line!r}\n{text}")
              data = tarfile.open(fileobj=io.BytesIO(members["data.tar.gz"]), mode="r:gz")
              names = set(data.getnames())
              for path in ("opt/bin/loft-ndms", "opt/etc/init.d/S99loft", "opt/etc/loft/client.yaml.sample"):
                  if path not in names:
                      raise SystemExit(f"{f} missing {path}")
              blob = data.extractfile("opt/bin/loft-ndms").read()
              b = blob[:64]
              if b[:4] != b"\x7fELF" or b[5] != 1:
                  raise SystemExit(f"{f} not little-endian ELF")
              got = (b[4], struct.unpack_from("<H", b, 18)[0])
              flags = struct.unpack_from("<I", b, 36)[0]
              if got != (cls, mach):
                  raise SystemExit(f"{f} elf {got} want {(cls, mach)}")
              if name == "armv7" and (flags & FLOAT_HARD):
                  raise SystemExit(f"{f} arm flags {flags:#x}")
              if buildinfo[name] not in blob or ver.encode() not in blob:
                  raise SystemExit(f"{f} buildinfo missing {buildinfo[name]!r}")
              print(f, "ok", hex(flags))
          sums = f"loft-ndms-{ver}-SHA256SUMS.txt"
          subprocess.check_call(["sha256sum", "-c", sums])
          for f in sorted(glob.glob(f"loft-ndms-{ver}-*.ipk")):
              subprocess.check_call(["sha256sum", "-c", f + ".sha256"])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ndms
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ndms/loft-ndms-*.ipk
            dist/ndms/loft-ndms-*.ipk.sha256
            dist/ndms/loft-ndms-*-SHA256SUMS.txt

  release:
    needs: [linux, macos, android, windows, mikrotik, ndms]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Versioned Dist names
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          found() { find artifacts -type f -name "$1" | grep -q .; }
          for need in \
            "loft-macos-${ver}-arm64.dmg" "loft-macos-${ver}-amd64.dmg" \
            "loft-clients-${ver}-darwin-arm64.tar.gz" "loft-clients-${ver}-darwin-amd64.tar.gz" \
            "loft-clients-${ver}-linux-arm64.tar.gz" "loft-clients-${ver}-linux-amd64.tar.gz" \
            "loft-node-${ver}-linux-arm64.tar.gz" "loft-node-${ver}-linux-amd64.tar.gz" \
            "loft-node_${ver}_arm64.deb" "loft-node_${ver}_amd64.deb" \
            "loft-panel-${ver}-linux-arm64.tar.gz" "loft-panel-${ver}-linux-amd64.tar.gz" \
            "loft-panel_${ver}_arm64.deb" "loft-panel_${ver}_amd64.deb" \
            "loft-windows-${ver}-amd64.zip" "loft-windows-${ver}-386.zip" "loft-windows-${ver}-arm64.zip" \
            "loft-mikrotik-${ver}-amd64.tar" "loft-mikrotik-${ver}-arm64.tar" "loft-mikrotik-${ver}-armv7.tar" \
            "loft-mikrotik-${ver}-SHA256SUMS.txt" \
            "loft-ndms-${ver}-aarch64.ipk" "loft-ndms-${ver}-armv7.ipk" "loft-ndms-${ver}-mipsel.ipk" \
            "loft-ndms-${ver}-aarch64.ipk.sha256" "loft-ndms-${ver}-armv7.ipk.sha256" "loft-ndms-${ver}-mipsel.ipk.sha256" \
            "loft-ndms-${ver}-SHA256SUMS.txt" \
            "loft-windows-${ver}-SHA256SUMS.txt" \
            "loft-clients-${ver}-SHA256SUMS.txt" "loft-node-${ver}-SHA256SUMS.txt" "loft-panel-${ver}-SHA256SUMS.txt"
          do
            found "$need"
          done
          if found "loft-android-${ver}.apk"; then
            found "loft-androidtv-${ver}.apk"
            found "loft-android-${ver}-SHA256SUMS.txt"
          fi
          find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.tar' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' -o -name '*.zip' -o -name '*.ipk' -o -name '*.sha256' -o -name '*SHA256SUMS.txt' \
          \) | sort
      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          mapfile -t files < <(find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.tar' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' -o -name '*.zip' -o -name '*.ipk' -o -name '*.sha256' -o -name '*SHA256SUMS.txt' \
          \) | grep -E -- "-${ver}-|_${ver}_" | sort)
          [ "${#files[@]}" -gt 0 ]
          notes=GH_RELEASE.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "loft $ver" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --title "loft $ver" --notes-file "$notes" "${files[@]}"
            else
              gh release create "$GITHUB_REF_NAME" --title "loft $ver" --generate-notes "${files[@]}"
            fi
          fi
