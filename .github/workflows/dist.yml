name: Dist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Match tag to VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(tr -d ' \n' < VERSION)
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $ver" >&2
            exit 1
          fi

  # Module proxy and pkg.go.dev lag the git tag. Dist asks both so
  # https://pkg.go.dev/github.com/a3app/loft follows the release.
  # 408 from POST /fetch/… is pkgsite still building, not an error.
  go-index:
    name: pkg.go.dev
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch module into proxy.golang.org
        env:
          MOD: github.com/${{ github.repository }}
        run: |
          set -eu
          ver=$GITHUB_REF_NAME
          proxy="https://proxy.golang.org/${MOD}/@v/${ver}"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS -o /tmp/mod.info "$proxy.info"; then
              ok=1
              break
            fi
            echo "proxy miss ${i}, retry" >&2
            sleep 15
          done
          [ "$ok" = 1 ]
          cat /tmp/mod.info
          curl -fsS -o /tmp/mod.mod "$proxy.mod"
          curl -fsS -o /dev/null "$proxy.zip"
          curl -fsS "https://sum.golang.org/lookup/${MOD}@${ver}"

      - name: Request pkg.go.dev docs
        env:
          MOD: github.com/${{ github.repository }}
        run: |
          set -eu
          ver=$GITHUB_REF_NAME
          url="https://pkg.go.dev/fetch/${MOD}@${ver}"
          code=$(curl -sS -o /tmp/pkg-fetch.txt -w '%{http_code}' -X POST -A 'loft-dist' "$url" || true)
          cat /tmp/pkg-fetch.txt || true
          echo "pkg.go.dev fetch HTTP ${code}"
          case "$code" in
            200|408) ;;
            *) echo "pkg.go.dev fetch returned ${code} (non-fatal)" >&2 ;;
          esac
          curl -sS -o /dev/null -w "pkg.go.dev page %{http_code}\n" \
            -A 'loft-dist' "https://pkg.go.dev/${MOD}@${ver}" || true

  linux:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Node packages, panel and CLI archives
        run: make dist-node dist-panel dist-clients
      - name: Unique checksum names
        run: |
          ver=$(tr -d ' \n' < VERSION)
          cp dist/node/SHA256SUMS "dist/node/loft-node-${ver}-SHA256SUMS.txt"
          cp dist/clients/go/SHA256SUMS "dist/clients/go/loft-clients-${ver}-SHA256SUMS.txt"
          cp dist/panel/SHA256SUMS "dist/panel/loft-panel-${ver}-SHA256SUMS.txt"
      - name: Smoke archives
        run: |
          set -eu
          find dist/node dist/panel dist/clients/go -name '*.tar.gz' | sort | while IFS= read -r f; do
            tar -tzf "$f" >/dev/null
            echo "$f"
          done
          find dist/node dist/panel -name '*.deb' | sort
      - name: Smoke checksums
        # The release page lists assets flat, so check each SHA256SUMS the
        # way a user would: files copied into one folder, then sha256sum -c.
        run: |
          set -eu
          for d in dist/node dist/panel dist/clients/go; do
            flat=$(mktemp -d)
            find "$d" -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} "$flat"/ \;
            (cd "$flat" && sha256sum -c "$GITHUB_WORKSPACE/$d/SHA256SUMS")
            rm -rf "$flat"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/node/**/*.tar.gz
            dist/node/**/*.deb
            dist/node/loft-node-*-SHA256SUMS.txt
            dist/panel/**/*.tar.gz
            dist/panel/**/*.deb
            dist/panel/loft-panel-*-SHA256SUMS.txt
            dist/clients/go/*.tar.gz
            dist/clients/go/loft-clients-*-SHA256SUMS.txt

  macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: macOS DMGs arm + intel (ad-hoc, no VERSION bump)
        run: make macos-dmgs BUMP=0
      - name: Smoke DMGs
        run: |
          set -eu
          ver=$(tr -d ' \n' < clients/macOS/VERSION)
          test -f "dist/clients/macOS/loft-${ver}-macos-arm.dmg"
          test -f "dist/clients/macOS/loft-${ver}-macos-intel.dmg"
          ls -l dist/clients/macOS/*.dmg
      - name: Drop scratch images
        run: rm -f dist/clients/macOS/*.rw.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          retention-days: 14
          path: dist/clients/macOS/*.dmg

  android:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # v3 runs `sdkmanager tools`; Google no longer serves that package.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: NDK
        run: |
          set -eu
          sdkmanager --install "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: GitHub signing key
        env:
          LOFT_ANDROID_KEYSTORE: ${{ secrets.LOFT_ANDROID_KEYSTORE }}
          LOFT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LOFT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${LOFT_ANDROID_KEYSTORE}" ] || [ -z "${LOFT_ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "skip=1" >> "$GITHUB_ENV"
            echo "no LOFT_ANDROID_KEYSTORE secret; skip APK" >&2
            exit 0
          fi
          mkdir -p secrets
          echo "${LOFT_ANDROID_KEYSTORE}" | base64 -d > secrets/android-github.p12
          printf '%s' "${LOFT_ANDROID_KEYSTORE_PASSWORD}" > secrets/android-github.pass
          chmod 600 secrets/android-github.p12 secrets/android-github.pass
      - name: GitHub-channel APKs
        if: env.skip != '1'
        env:
          # issues:write on a3app/loft only; baked into the APK. Empty: reports queue.
          LOFT_ANDROID_CRASH_TOKEN: ${{ secrets.LOFT_ANDROID_CRASH_TOKEN }}
        run: make -C clients/Android release
      - name: Smoke APKs
        if: env.skip != '1'
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          test -f "dist/clients/Android/loft-${ver}-android.apk"
          test -f "dist/clients/Android/loft-${ver}-android-tv.apk"
          test -f "dist/clients/Android/loft-android-${ver}-SHA256SUMS.txt"
          unzip -t "dist/clients/Android/loft-${ver}-android.apk" >/dev/null
          unzip -t "dist/clients/Android/loft-${ver}-android-tv.apk" >/dev/null
      - uses: actions/upload-artifact@v4
        if: env.skip != '1'
        with:
          name: android
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/clients/Android/loft-*-android.apk
            dist/clients/Android/loft-*-android-tv.apk
            dist/clients/Android/loft-android-*-SHA256SUMS.txt

  windows:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 zip unzip
      - name: llvm-mingw (Windows ARM64)
        run: |
          set -eu
          ver=20261020
          tar=llvm-mingw-${ver}-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${ver}/${tar}"
          echo "55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          sudo tar -C /opt -xJf /tmp/llvm-mingw.tar.xz
          echo "LLVM_MINGW=/opt/llvm-mingw-${ver}-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
      - name: Wintun 0.14.1
        run: make -C clients/Windows/wintun-check dist/x64/wintun.dll dist/x86/wintun.dll dist/arm64/wintun.dll
      - name: loft-front Windows ARM64
        run: make -C clients/Windows front-arm64 LLVM_MINGW="${LLVM_MINGW}"
      # Pinned XTLS/go-win7. Official Go 1.21+ cannot target Windows 7.
      # The zip is the SDK itself (bin/, src/, pkg/) or a top-level go/ directory.
      # ARM64 front already built: this overwrites GOROOT.
      - name: Patched Go for Windows 7
        run: |
          set -eu
          sdk=$(go env GOROOT)
          curl -fsSL -L -o /tmp/go-win7.zip \
            https://github.com/XTLS/go-win7/releases/download/patched-1.27.2/go-for-win7-linux-amd64.zip
          rm -rf "${sdk:?}/"*
          unzip -q /tmp/go-win7.zip -d "$sdk"
          if [ -x "$sdk/go/bin/go" ] && [ ! -x "$sdk/bin/go" ]; then
            mv "$sdk/go/"* "$sdk/"
            rmdir "$sdk/go" || true
          fi
          GOTOOLCHAIN=local "$sdk/bin/go" version
          echo "LOFT_GOROOT=$sdk" >> "$GITHUB_ENV"
      - name: loft-front Win7
        run: |
          set -eu
          test -x "${LOFT_GOROOT}/bin/go"
          make -C clients/Windows front GO_WIN7="${LOFT_GOROOT}/bin/go" GOROOT="${LOFT_GOROOT}"
      - name: Portable zips
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          make -C clients/Windows portable VER="$ver" LLVM_MINGW="${LLVM_MINGW}"
      - name: Smoke
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          sums="dist/clients/Windows/github/loft-windows-${ver}-SHA256SUMS.txt"
          test -f "$sums"
          (cd dist/clients/Windows/github && sha256sum -c "loft-windows-${ver}-SHA256SUMS.txt")
          for a in x86-64 x86 arm64; do
            z="dist/clients/Windows/github/loft-${ver}-windows-${a}.zip"
            test -f "$z"
            unzip -t "$z" >/dev/null
            unzip -l "$z" | grep -q 'loft.exe'
            unzip -l "$z" | grep -q 'loft-svc.exe'
            unzip -l "$z" | grep -q 'wintun.dll'
            unzip -l "$z" | grep -q 'loft-front.exe'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/clients/Windows/github/loft-*-windows-*.zip
            dist/clients/Windows/github/loft-windows-*-SHA256SUMS.txt

  release:
    needs: [linux, macos, android, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Versioned Dist names
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          found() { find artifacts -type f -name "$1" | grep -q .; }
          for need in \
            "loft-${ver}-macos-arm.dmg" "loft-${ver}-macos-intel.dmg" \
            "loft-${ver}-darwin-arm64.tar.gz" "loft-${ver}-darwin-amd64.tar.gz" \
            "loft-${ver}-linux-arm64.tar.gz" "loft-${ver}-linux-amd64.tar.gz" \
            "loft-node-${ver}-linux-arm64.tar.gz" "loft-node-${ver}-linux-amd64.tar.gz" \
            "loft-node_${ver}_arm64.deb" "loft-node_${ver}_amd64.deb" \
            "loft-panel-${ver}-linux-arm64.tar.gz" "loft-panel-${ver}-linux-amd64.tar.gz" \
            "loft-panel_${ver}_arm64.deb" "loft-panel_${ver}_amd64.deb" \
            "loft-${ver}-windows-x86-64.zip" "loft-${ver}-windows-x86.zip" "loft-${ver}-windows-arm64.zip" \
            "loft-windows-${ver}-SHA256SUMS.txt" \
            "loft-clients-${ver}-SHA256SUMS.txt" "loft-node-${ver}-SHA256SUMS.txt" "loft-panel-${ver}-SHA256SUMS.txt"
          do
            found "$need"
          done
          if found "loft-${ver}-android.apk"; then
            found "loft-${ver}-android-tv.apk"
            found "loft-android-${ver}-SHA256SUMS.txt"
          fi
          find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' -o -name '*.zip' -o -name '*SHA256SUMS.txt' \
          \) | sort
      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ver=$(tr -d ' \n' < VERSION)
          mapfile -t files < <(find artifacts -type f \( \
            -name '*.tar.gz' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' -o -name '*.zip' -o -name '*SHA256SUMS.txt' \
          \) | grep -E -- "-${ver}-|_${ver}_" | sort)
          [ "${#files[@]}" -gt 0 ]
          notes=GH_RELEASE.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "loft $ver" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --title "loft $ver" --notes-file "$notes" "${files[@]}"
            else
              gh release create "$GITHUB_REF_NAME" --title "loft $ver" --generate-notes "${files[@]}"
            fi
          fi
