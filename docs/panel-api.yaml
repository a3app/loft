# loft-panel HTTP API. Source of the route table: server/panel/web/web.go Handler().
# Unknown JSON fields are 400 (encoding/json DisallowUnknownFields).
# This file describes the existing JSON; it does not add routes.

openapi: 3.1.0
info:
  title: loft-panel HTTP API
  version: "1.0"
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    JSON under `/api/` of **loft-panel**. Privileged work goes through
    **loft-panel-adm** over a Unix socket. The UI is the same routes.

    Typical listen is `127.0.0.1:8091` behind nginx on the node.

    **Scripts use Bearer.** Users → token, or `POST /api/me/token`. Prefix
    `lpt_`. Header `Authorization: Bearer lpt_…`. Bearer POST does not send
    CSRF.

    **Browser session.** Cookie `loft_panel` (HttpOnly, SameSite=Strict).
    POST/PUT/PATCH/DELETE with a cookie also send `X-CSRF-Token` equal to
    `me.csrf` from `GET /api/state` (or the login reply). GET/HEAD do not.

    **Roles.** Areas: `main`, `node`, `members`, `segments`, `network`,
    `domains`, `mail`, `packages`, `users`, `system`, `settings`. Levels:
    0 none, 1 view, 2 change. Owner passes every route. `x-loft-perm` on
    each operation is `area:view` / `area:change`, `anyone` (signed in),
    `owner`, or empty (public).

    **Jobs.** A node restart drops the caller's HTTP path, so those POSTs
    answer **202** `{"job":"<id>"}`. Poll `GET /api/jobs/{id}` until
    `state` is `done` or `error`. Panel jobs live in memory (gone after
    panel restart). Package/update/backup helper jobs live in
    loft-panel-adm; poll `GET /api/packages/job`.

    **Errors.** `{"error":"<text>"}`. 400 bad JSON / validation; 401 sign-in
    or bad token; 403 role or CSRF; 404; 409 conflict; 421 unknown Host;
    422 panel-adm error; 429 login limiter; 503 loft-panel-adm not running.

    ```
    curl -sS -H "Authorization: Bearer lpt_…" http://127.0.0.1:8091/api/network
    ```

servers:
  - url: /
    description: loft-panel origin (often http://127.0.0.1:8091)

tags:
  - name: auth
    description: Setup, login, own profile, invitations, API tokens
  - name: overlay
    description: network.conf, member keys, presence
  - name: node
    description: loft-node service, node.conf, relays
  - name: jobs
    description: In-memory panel jobs
  - name: wizard
    description: First-run owner wizard
  - name: packages
    description: Catalog packages, MTProto, Dist updates
  - name: hostnet
    description: Host IP/routes and overlay exit channels
  - name: main
    description: Overview
  - name: users
    description: Panel users, roles, sessions, audit
  - name: domains
    description: DNS providers, zones, certificates
  - name: mail
    description: Postfix/Dovecot mail
  - name: system
    description: Host users, login guard, backups
  - name: settings
    description: Panel session limits, language, SMTP notify

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: lpt_
      description: Panel API token. Prefix lpt_. No CSRF.
    cookieAuth:
      type: apiKey
      in: cookie
      name: loft_panel
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on cookie POST. Value is me.csrf.

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Empty:
      type: object
      additionalProperties: false
    Object:
      type: object
      additionalProperties: true
      description: JSON object; unknown fields are 400.
    JobAccepted:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job:
          type: string
          description: Hex id for GET /api/jobs/{id}
    Job:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id: {type: string}
        state:
          type: string
          enum: [running, done, error]
        error: {type: string}
        result:
          description: Handler result once state is done
    Me:
      type: object
      additionalProperties: false
      required: [login, role, role_name, perms, csrf]
      properties:
        login: {type: string}
        name: {type: string}
        role: {type: string}
        role_name: {type: string}
        perms:
          type: object
          additionalProperties: {type: integer}
          description: area → 0 none, 1 view, 2 change
        csrf:
          type: string
          description: Empty on Bearer /api/me; set after cookie login
    Creds:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: {type: string}
        password: {type: string}
        code:
          type: string
          description: Setup code; POST /api/setup only
        remember:
          type: boolean
          description: Cookie Max-Age = session max
    InviteAccept:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, minLength: 12}
    Network:
      type: object
      additionalProperties: false
      required: [text, sha256]
      properties:
        text:
          type: string
          description: network.conf commands
        sha256: {type: string}
        legacy:
          type: boolean
          description: Read from network.yaml
    NetworkText:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string}
    NetworkApply:
      type: object
      additionalProperties: false
      required: [text, expect]
      properties:
        text: {type: string}
        expect:
          type: string
          description: sha256 from GET /api/network; empty = file must not exist
    Check:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}
        error: {type: string}
    MemberID:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
    IssuedKey:
      type: object
      additionalProperties: false
      required: [id, key, key_sha256]
      properties:
        id: {type: string}
        key:
          type: string
          description: Plaintext lt_ secret
        key_sha256: {type: string}
        link: {type: string}
        file: {type: string}
        qr:
          type: string
          description: SVG
    MemberProtoIn:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
        proto:
          type: array
          items:
            type: string
            enum: [loft, vless, trojan, ss]
        delete: {type: boolean}
    QRText:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 2048}
    NodeStatus:
      type: object
      additionalProperties: false
      properties:
        active: {type: string}
        since: {type: string}
        version: {type: string}
    NodeConfig:
      type: object
      additionalProperties: true
      description: node.conf fields the panel edits (role, listen, advertise, fronts, inner, decoy, mask, paths, relays, cdn_peers, …) plus shown-only mask_pub, controller_pub, lists, node.
    NodeLists:
      type: object
      additionalProperties: false
      required: [lists]
      properties:
        lists:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    CtlRoll:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days: {type: integer}
    RelayID:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
    Name:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
    DomainSet:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        panel: {type: string}
    WizardMember:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
        name: {type: string}
    PackagePlan:
      type: object
      additionalProperties: false
      properties:
        install:
          type: array
          items: {type: string}
        remove:
          type: array
          items: {type: string}
        upgrade:
          type: array
          items: {type: string}
        purge: {type: boolean}
    PackageUnit:
      type: object
      additionalProperties: false
      required: [key, on]
      properties:
        key: {type: string}
        on: {type: boolean}
    MTProtoSet:
      type: object
      additionalProperties: false
      properties:
        port: {type: integer}
        domain: {type: string}
        rotate_secret: {type: boolean}
    UpdateApply:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag: {type: string, description: "vX.Y.Z"}
    UpdateSettings:
      type: object
      additionalProperties: true
    NetChange:
      type: object
      additionalProperties: false
      required: [op, dev]
      properties:
        op: {type: string}
        addr: {type: string}
        dst: {type: string}
        via: {type: string}
        dev: {type: string}
    NetID:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
    ChannelName:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        id: {type: string}
    MePassword:
      type: object
      additionalProperties: false
      required: [current, password]
      properties:
        current: {type: string}
        password: {type: string, minLength: 12}
    TokenRevoke:
      type: object
      additionalProperties: false
      properties:
        revoke: {type: boolean}
    MeSessionsEnd:
      type: object
      additionalProperties: false
      properties:
        key: {type: string}
        others: {type: boolean}
    UserSave:
      type: object
      additionalProperties: false
      required: [login, role]
      properties:
        login: {type: string}
        name: {type: string}
        role: {type: string}
        password: {type: string}
        disabled: {type: boolean}
        new: {type: boolean}
        invite: {type: boolean}
    Login:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        login: {type: string}
    UserToken:
      type: object
      additionalProperties: false
      required: [login]
      properties:
        login: {type: string}
        revoke: {type: boolean}
    Role:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        perms:
          type: object
          additionalProperties: {type: integer}
        builtin: {type: boolean}
    ID:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
    SessionKey:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: {type: string}
    ProviderSave:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        kind: {type: string}
        token: {type: string}
        user: {type: string}
        delete: {type: boolean}
        check_only: {type: boolean}
    ZoneSave:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        provider: {type: string}
        delete: {type: boolean}
        create:
          type: array
          items: {type: string}
        hosts:
          type: array
          items: {type: string}
    RecordSave:
      type: object
      additionalProperties: false
      properties:
        zone: {type: string}
        record: {type: object, additionalProperties: true}
        auto: {type: boolean}
        delete: {type: boolean}
    CertIssue:
      type: object
      additionalProperties: false
      properties:
        names:
          type: array
          items: {type: string}
        method: {type: string}
        use: {type: string}
        id: {type: string}
    CertUpload:
      type: object
      additionalProperties: false
      properties:
        fullchain: {type: string}
        key: {type: string}
        use: {type: string}
    MailDomainName:
      type: object
      additionalProperties: false
      properties:
        domain: {type: string}
        name: {type: string}
    BackupSettings:
      type: object
      additionalProperties: false
      properties:
        schedule: {type: string}
        keep: {type: integer}
        store: {type: string}
        mail: {type: boolean}
    BackupFetch:
      type: object
      additionalProperties: false
      properties:
        store: {type: string}
        name: {type: string}
    BackupRestore:
      type: object
      additionalProperties: false
      properties:
        file: {type: string}
        parts:
          type: array
          items: {type: string}
        phrase: {type: string}

  responses:
    Error:
      description: {"error": text}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdmDown:
      description: loft-panel-adm is not running
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /api/state:
    get:
      operationId: state
      tags: [auth]
      summary: "First UI call. No sign-in. setup, wizard, lang, port_activity; me+version when the loft_panel cookie is valid."
      x-loft-perm: "public"
      security: []
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/setup:
    post:
      operationId: setup
      tags: [auth]
      summary: "Create the first owner. Needs the setup code from the host. Signs in."
      x-loft-perm: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Creds"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/login:
    post:
      operationId: login
      tags: [auth]
      summary: "Password sign-in. Sets cookie loft_panel. Failed attempts are slowed and may 429."
      x-loft-perm: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Creds"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: "End this session and clear the cookie."
      x-loft-perm: "anyone"
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/invite/{token}:
    get:
      operationId: inviteGet
      tags: [auth]
      summary: "Invitation landing: login and name. 404 if used or expired."
      x-loft-perm: "public"
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
          description: invitation token
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/invite:
    post:
      operationId: inviteAccept
      tags: [auth]
      summary: "Set password from an invitation and sign in."
      x-loft-perm: "public"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAccept"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/network:
    get:
      operationId: networkGet
      tags: [overlay]
      summary: "network.conf as text plus sha256. Next apply must quote sha256 as expect."
      x-loft-perm: "members,segments:view"
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/network/check:
    post:
      operationId: networkCheck
      tags: [overlay]
      summary: "Parse network.conf text without writing. Audit skipped."
      x-loft-perm: "members,segments:view"
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkText"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/network/apply:
    post:
      operationId: networkApply
      tags: [overlay]
      summary: "Write network.conf and restart the node. expect is the sha256 from GET."
      x-loft-perm: "members,segments:change"
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkApply"
      responses:
        "202":
          description: Job started; poll GET /api/jobs/{id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/members/key:
    get:
      operationId: memberKeyGet
      tags: [overlay]
      summary: "Show a stored member key again. 404 if the node did not keep it."
      x-loft-perm: "members:change"
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
          description: member id
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKey"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
    post:
      operationId: memberKeyIssue
      tags: [overlay]
      summary: "Issue a new lt_ key into members.keys. Put key_sha256 into network.conf and apply."
      x-loft-perm: "members:change"
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberID"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKey"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/members/proto:
    get:
      operationId: memberProtoGet
      tags: [overlay]
      summary: "Extra protocols per member (loft, vless, trojan, ss). Lives in panel settings.json, not network.conf."
      x-loft-perm: "members,segments:view"
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
    post:
      operationId: memberProtoSet
      tags: [overlay]
      summary: "Set or delete extra protocols for one member id."
      x-loft-perm: "members:change"
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProtoIn"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/qr:
    post:
      operationId: qr
      tags: [overlay]
      summary: "QR SVG of a profile link the caller already holds. Text is not logged. Audit skipped."
      x-loft-perm: "members:change"
      security:
        - bearerAuth: []
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRText"
      responses:
        "200":
          description: JSON; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/AdmDown"
  /api/presence:
    get:
      operationId: presenceGet
      tags: [overlay]
      summary: "Online devices from node-status.json plus last-seen. keys counts current vs old controller key."
      x-loft-perm: "members,segments,main:view"
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
